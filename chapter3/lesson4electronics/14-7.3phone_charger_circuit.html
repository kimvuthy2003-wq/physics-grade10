<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>សៀគ្វីឆ្នាំងសាកអថេរ DC ដែលអាចលៃតម្រូវតង់ស្យុងបាន(Variable DC Charger)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Battambang', sans-serif;
            background-color: #f0f9ff;
            margin: 0;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .app-card {
            width: 100%;
            max-width: 1100px;
            background: #ffffff;
            border-radius: 1.5rem;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.15);
            overflow: hidden;
            border: 1px solid #bae6fd;
            display: flex;
            flex-direction: column;
        }
        .canvas-container {
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 25px 25px;
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            max-width: 1000px;
            margin: 0 auto;
        }
        /* Custom Input Ranges */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            border: 2px solid white;
            background: #3b82f6;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: #cbd5e1;
            border-radius: 4px;
        }
        .btn-toggle {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }
        .btn-toggle:active { transform: scale(0.96); }
        /* Digital LCD Font */
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        .lcd-text { font-family: 'Share Tech Mono', monospace; }
    </style>
</head>
<body>

    <div class="app-card">
        <!-- Header -->
        <div class="bg-blue-600 text-white p-5 text-center">
            <h1 class="text-2xl font-bold tracking-wide">ការដំឡើងសៀគ្វីឆ្នាំងសាកអថេរ ដែលអាចលៃតម្រូវតង់ស្យុងបាន</h1>
            <p class="text-blue-100 text-sm mt-1">ប្រើប្រាស់ត្រង់ស៊ីស្ទ័រ NPN ជា Emitter Follower ដើម្បីបញ្ចេញតង់ស្យុង DC</p>
        </div>

        <!-- Schematic Canvas -->
        <div class="canvas-container w-full flex justify-center">
            <canvas id="circuitCanvas" width="900" height="500"></canvas>
        </div>

        <!-- Controls and Explanations -->
        <div class="p-6 flex flex-col lg:flex-row gap-8 bg-white items-stretch">
            
            <!-- Left: Controls -->
            <div class="flex flex-col gap-6 w-full lg:w-1/3 justify-center">
                
                <!-- Power Switch -->
                <button id="btnPower" onclick="togglePower()" class="btn-toggle py-4 px-6 rounded-2xl font-bold text-lg text-white bg-slate-500 shadow-md flex justify-center items-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                    <span id="txtPower">កុងតាក់ (SW) : បើក (OFF)</span>
                </button>

                <!-- Potentiometer Slider -->
                <div class="bg-blue-50 p-5 rounded-xl border border-blue-200">
                    <label class="flex justify-between font-bold text-blue-800 mb-3 text-sm">
                        <span>លៃតម្រូវប៉ូតង់ស្យូម៉ែត្រ (P)</span>
                        <span id="potValText">50%</span>
                    </label>
                    <input type="range" id="potSlider" min="0" max="100" value="50">
                    <div class="flex justify-between text-xs text-blue-600 mt-2 font-bold">
                        <span>Min (0V)</span>
                        <span>Max (12V)</span>
                    </div>
                </div>
            </div>

            <!-- Middle: Voltage Display -->
            <div class="flex flex-col gap-4 w-full lg:w-1/3 justify-center">
                <div class="bg-slate-800 p-4 rounded-xl border-4 border-slate-700 shadow-inner flex flex-col items-center justify-center">
                    <span class="text-slate-400 font-bold text-xs uppercase tracking-widest mb-1">តង់ស្យុងនៅជើង Base (V_B)</span>
                    <span id="vbDisplay" class="lcd-text text-3xl text-emerald-400">0.00 V</span>
                </div>
                <div class="bg-slate-800 p-4 rounded-xl border-4 border-slate-700 shadow-inner flex flex-col items-center justify-center">
                    <span class="text-slate-400 font-bold text-xs uppercase tracking-widest mb-1">តង់ស្យុងបញ្ចេញ (Output V_E)</span>
                    <span id="veDisplay" class="lcd-text text-3xl text-amber-400">0.00 V</span>
                </div>
            </div>

            <!-- Right: Dynamic Analysis -->
            <div class="flex-1">
                <div class="h-full bg-slate-50 border border-slate-200 rounded-2xl p-6 flex flex-col justify-center transition-colors duration-500" id="infoBox">
                    <h3 class="text-indigo-700 font-bold text-lg mb-3 flex items-center gap-2 border-b border-indigo-100 pb-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        ការវិភាគសៀគ្វី៖
                    </h3>
                    <div id="explanationText" class="text-slate-700 text-[1rem] leading-relaxed font-bold">
                        <!-- Text dynamically injected -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const canvas = document.getElementById('circuitCanvas');
        const ctx = canvas.getContext('2d');
        
        // DOM Elements
        const btnPower = document.getElementById('btnPower');
        const txtPower = document.getElementById('txtPower');
        const potSlider = document.getElementById('potSlider');
        const potValText = document.getElementById('potValText');
        const vbDisplay = document.getElementById('vbDisplay');
        const veDisplay = document.getElementById('veDisplay');
        const explanationText = document.getElementById('explanationText');
        const infoBox = document.getElementById('infoBox');

        // Physics State
        let isPowerOn = false;
        let potPercent = 50; // 0 to 100
        let vBase = 0;
        let vEmitter = 0;
        let isCharging = false;
        
        // Animation
        let dashOffset = 0;
        let lastTime = performance.now();

        // Canvas Coordinates (Strictly Orthogonal)
        const Y_TOP = 100;
        const Y_BOT = 420;
        const Y_WIPER = 260; // Base level
        const Y_OUT = 320;   // Emitter output rail
        
        const X_BAT = 80;
        const X_SW = 160;
        const X_POT = 300;
        const X_TRANS = 460;
        const X_BR1 = 580; // LED + R2
        const X_BR2 = 680; // R1
        const X_BR3 = 780; // Phone

        function updateLogic() {
            potPercent = parseInt(potSlider.value);
            potValText.innerText = potPercent + "%";

            if (!isPowerOn) {
                vBase = 0;
                vEmitter = 0;
                isCharging = false;
            } else {
                // Potentiometer acts as voltage divider: V_B = 12V * (potPercent / 100)
                vBase = 12.0 * (potPercent / 100);
                
                // Emitter Follower: V_E = V_B - V_BE (approx 0.7V drop)
                vEmitter = Math.max(0, vBase - 0.7);
                
                // Charging threshold
                isCharging = vEmitter > 2.0; 
            }
            updateUI();
        }

        function togglePower() {
            isPowerOn = !isPowerOn;
            updateLogic();
        }

        potSlider.addEventListener('input', updateLogic);

        function updateUI() {
            // UI Button
            if (isPowerOn) {
                btnPower.className = "btn-toggle py-4 px-6 rounded-2xl font-bold text-lg text-white bg-blue-600 shadow-md flex justify-center items-center gap-3";
                txtPower.innerText = "កុងតាក់ (SW) : បិទ (ON)";
            } else {
                btnPower.className = "btn-toggle py-4 px-6 rounded-2xl font-bold text-lg text-white bg-slate-500 shadow-md flex justify-center items-center gap-3";
                txtPower.innerText = "កុងតាក់ (SW) : បើក (OFF)";
            }

            // LCD Displays
            vbDisplay.innerText = vBase.toFixed(2) + " V";
            veDisplay.innerText = vEmitter.toFixed(2) + " V";

            // Explanations
            if (!isPowerOn) {
                infoBox.className = "h-full bg-slate-100 border border-slate-200 rounded-2xl p-6 flex flex-col justify-center transition-colors duration-500";
                explanationText.innerHTML = `កុងតាក់ត្រូវបានបើក (OFF)។ <br>គ្មានចរន្តអគ្គិសនីហូរចូលសៀគ្វីទេ។ តង់ស្យុងនៅជើង Base និង Output គឺ 0V។`;
            } else {
                if (isCharging) {
                    infoBox.className = "h-full bg-emerald-50 border border-emerald-200 rounded-2xl p-6 flex flex-col justify-center transition-colors duration-500 shadow-[0_0_15px_rgba(16,185,129,0.1)]";
                    explanationText.innerHTML = `តង់ស្យុង Base <span class="text-emerald-600 font-bold">${vBase.toFixed(1)}V</span> បញ្ជាឱ្យត្រង់ស៊ីស្ទ័រ NPN បើកចំហរ។ <br>តង់ស្យុងបញ្ចេញ (Output) គឺ <span class="text-emerald-600 font-bold">${vEmitter.toFixed(1)}V</span>។ <br>អំពូល LED ភ្លឺ ហើយទូរសព្ទកំពុងសាកថ្មព្រោះ V > 2V។`;
                } else {
                    infoBox.className = "h-full bg-amber-50 border border-amber-200 rounded-2xl p-6 flex flex-col justify-center transition-colors duration-500 shadow-[0_0_15px_rgba(245,158,11,0.1)]";
                    explanationText.innerHTML = `តង់ស្យុងបញ្ចេញ (Output) ត្រឹមតែ <span class="text-amber-600 font-bold">${vEmitter.toFixed(1)}V</span> ដែលខ្សោយពេក។ <br>អំពូល LED មិនទាន់ភ្លឺ ហើយទូរសព្ទមិនទាន់សាកថ្មទេ (ត្រូវការ V > 2V)។ សូមអូសដំឡើងប៉ូតង់ស្យូម៉ែត្រ។`;
                }
            }
        }

        // --- Canvas Drawing Helpers ---
        const C_WIRE = '#334155';
        const C_CURRENT = '#f59e0b';
        
        function drawSolidWire(points) {
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for(let i=1; i<points.length; i++) ctx.lineTo(points[i].x, points[i].y);
            ctx.strokeStyle = C_WIRE;
            ctx.lineWidth = 3;
            ctx.lineCap = 'square';
            ctx.lineJoin = 'miter';
            ctx.stroke();
        }

        function drawAnimWire(points) {
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for(let i=1; i<points.length; i++) ctx.lineTo(points[i].x, points[i].y);
            ctx.strokeStyle = C_CURRENT;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.setLineDash([8, 14]);
            ctx.lineDashOffset = dashOffset;
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawNode(x, y) {
            ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI*2); ctx.fillStyle = C_WIRE; ctx.fill();
        }

        function drawBattery(x, yTop, yBot) {
            const yMid = (yTop + yBot) / 2;
            ctx.save(); ctx.translate(x, yMid);
            ctx.strokeStyle = C_WIRE; ctx.lineWidth = 3;
            
            // Wires to top/bot
            ctx.beginPath(); ctx.moveTo(0, -(yBot - yTop)/2); ctx.lineTo(0, -25); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, (yBot - yTop)/2); ctx.lineTo(0, 25); ctx.stroke();
            
            // Cells
            ctx.beginPath();
            ctx.moveTo(-20, -25); ctx.lineTo(20, -25); // +
            ctx.lineWidth = 6; ctx.moveTo(-10, -5); ctx.lineTo(10, -5); // -
            ctx.lineWidth = 3;
            ctx.moveTo(-20, 5); ctx.lineTo(20, 5); // +
            ctx.lineWidth = 6; ctx.moveTo(-10, 25); ctx.lineTo(10, 25); // -
            ctx.stroke();

            // Labels
            ctx.font = "bold 16px Arial"; ctx.fillStyle = C_WIRE; ctx.textAlign = "right";
            ctx.fillText("12V", -30, 5);
            ctx.fillText("+", -25, -20); ctx.fillText("-", -25, 30);
            ctx.restore();
        }

        function drawSwitch(x, y, isClosed) {
            ctx.save(); ctx.translate(x, y);
            ctx.strokeStyle = C_WIRE; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(-25, 0); ctx.lineTo(-10, 0); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(25, 0); ctx.stroke();
            
            ctx.beginPath(); ctx.arc(-10, 0, 3, 0, Math.PI*2); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(10, 0, 3, 0, Math.PI*2); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
            
            ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(isClosed ? 10 : 5, isClosed ? 0 : -15); ctx.stroke();
            ctx.font = "bold 14px Arial"; ctx.fillStyle = C_WIRE; ctx.textAlign = "center"; ctx.fillText("SW", 0, -20);
            ctx.restore();
        }

        function drawPotentiometer(x, yTop, yBot, wiperY) {
            ctx.save(); ctx.translate(x, yTop);
            const h = yBot - yTop;
            ctx.strokeStyle = C_WIRE; ctx.lineWidth = 3;
            
            // Lines to box
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 40); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, h); ctx.lineTo(0, h - 40); ctx.stroke();
            
            // Box
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.rect(-10, 40, 20, h - 80); ctx.fill(); ctx.stroke();
            
            // Wiper
            const relativeWiper = wiperY - yTop;
            ctx.beginPath(); ctx.moveTo(25, relativeWiper); ctx.lineTo(10, relativeWiper); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(10, relativeWiper); ctx.lineTo(15, relativeWiper - 5); ctx.lineTo(15, relativeWiper + 5); ctx.closePath();
            ctx.fillStyle = C_WIRE; ctx.fill();

            // Label
            ctx.font = "bold 14px Arial"; ctx.textAlign = "right";
            ctx.fillText("P", -15, h/2);
            ctx.fillText("1", -15, 50);
            ctx.fillText("2", -15, h - 40);
            ctx.restore();
        }

        function drawTransistor(x, y) {
            ctx.save(); ctx.translate(x, y);
            ctx.strokeStyle = C_WIRE; ctx.lineWidth = 3;
            
            // Base wire
            ctx.beginPath(); ctx.moveTo(-35, 0); ctx.lineTo(-10, 0); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-10, -20); ctx.lineTo(-10, 20); ctx.stroke(); // Vertical bar
            
            // Collector (goes UP)
            ctx.beginPath(); ctx.moveTo(-10, -10); ctx.lineTo(15, -30); ctx.lineTo(15, -35); ctx.stroke();
            // Emitter (goes DOWN)
            ctx.beginPath(); ctx.moveTo(-10, 10);  ctx.lineTo(15, 30);  ctx.lineTo(15, 35); ctx.stroke();

            // NPN Arrow on Emitter pointing OUT
            ctx.translate(5, 22); ctx.rotate(Math.atan2(20, 25));
            ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-6, -5); ctx.lineTo(-6, 5); ctx.closePath();
            ctx.fillStyle = C_WIRE; ctx.fill();

            ctx.restore();
            
            ctx.font = "bold 14px Arial"; ctx.fillStyle = C_WIRE; ctx.textAlign = "left";
            ctx.fillText("NPN", x + 25, y - 5);
            ctx.fillText("B", x - 25, y - 10);
            ctx.fillText("C", x + 5, y - 25);
            ctx.fillText("E", x + 5, y + 35);
        }

        function drawVerticalResistor(x, yTop, yBot, label) {
            const yMid = (yTop + yBot) / 2;
            ctx.save(); ctx.translate(x, yMid);
            ctx.strokeStyle = C_WIRE; ctx.lineWidth = 3;
            
            ctx.beginPath(); ctx.moveTo(0, -(yBot-yTop)/2); ctx.lineTo(0, -20); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, (yBot-yTop)/2); ctx.lineTo(0, 20); ctx.stroke();
            
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.rect(-8, -20, 16, 40); ctx.fill(); ctx.stroke();
            
            ctx.font = "bold 14px Arial"; ctx.fillStyle = C_WIRE; ctx.textAlign = "left";
            ctx.fillText(label, 15, 5);
            ctx.restore();
        }

        function drawLEDAndResistor(x, yTop, yBot, isGlow) {
            const h = yBot - yTop;
            ctx.save(); ctx.translate(x, yTop);
            ctx.strokeStyle = C_WIRE; ctx.lineWidth = 3;
            
            // LED (Top part)
            const yLed = 30;
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, yLed - 15); ctx.stroke();
            
            if (isGlow) {
                ctx.beginPath(); ctx.arc(0, yLed, 20, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(239, 68, 68, 0.3)'; ctx.fill();
                ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 15;
            }
            
            ctx.beginPath(); ctx.arc(0, yLed, 15, 0, Math.PI*2);
            ctx.fillStyle = isGlow ? '#ef4444' : '#ffffff'; ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
            
            // Triangle
            ctx.beginPath(); ctx.moveTo(-10, yLed - 8); ctx.lineTo(10, yLed - 8); ctx.lineTo(0, yLed + 8); ctx.closePath();
            ctx.fillStyle = isGlow ? '#fff' : C_WIRE; ctx.fill();
            // Bar
            ctx.beginPath(); ctx.moveTo(-10, yLed + 8); ctx.lineTo(10, yLed + 8); ctx.strokeStyle = isGlow ? '#fff' : C_WIRE; ctx.stroke();
            
            // Arrows
            ctx.strokeStyle = C_WIRE; ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(15, yLed - 10); ctx.lineTo(25, yLed - 20);
            ctx.moveTo(25, yLed - 20); ctx.lineTo(20, yLed - 20); ctx.moveTo(25, yLed - 20); ctx.lineTo(25, yLed - 15);
            ctx.moveTo(20, yLed - 5); ctx.lineTo(30, yLed - 15);
            ctx.moveTo(30, yLed - 15); ctx.lineTo(25, yLed - 15); ctx.moveTo(30, yLed - 15); ctx.lineTo(30, yLed - 10);
            ctx.stroke();
            
            ctx.font = "bold 14px Arial"; ctx.fillStyle = C_WIRE; ctx.textAlign = "right"; ctx.fillText("LED", -20, yLed + 5);

            // Resistor (Bottom part)
            const yRes = 80;
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(0, yLed + 15); ctx.lineTo(0, yRes - 20); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, yRes + 20); ctx.lineTo(0, h); ctx.stroke();
            
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.rect(-8, yRes - 20, 16, 40); ctx.fill(); ctx.stroke();
            ctx.textAlign = "left"; ctx.fillText("R2 220Ω", 15, yRes + 5);
            
            ctx.restore();
        }

        function drawPhone(x, yTop, yBot, isChg) {
            const yMid = (yTop + yBot) / 2;
            ctx.save(); ctx.translate(x, yMid);
            ctx.strokeStyle = C_WIRE; ctx.lineWidth = 3;
            
            // Wires to top/bot
            ctx.beginPath(); ctx.moveTo(0, -(yBot-yTop)/2); ctx.lineTo(0, -45); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, (yBot-yTop)/2); ctx.lineTo(0, 45); ctx.stroke();

            // Phone Body
            ctx.fillStyle = '#1e293b';
            ctx.beginPath(); ctx.roundRect(-25, -45, 50, 90, 8); ctx.fill();
            
            // Screen
            ctx.fillStyle = isChg ? '#0f172a' : '#020617';
            ctx.beginPath(); ctx.roundRect(-20, -35, 40, 70, 2); ctx.fill();

            // Charging Icon
            if (isChg) {
                // Battery border
                ctx.strokeStyle = '#34d399'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.roundRect(-10, -15, 20, 30, 2); ctx.stroke();
                ctx.fillStyle = '#34d399'; ctx.fillRect(-4, -18, 8, 3);
                // Bolt
                ctx.fillStyle = '#fbbf24';
                ctx.beginPath(); ctx.moveTo(2, -10); ctx.lineTo(-6, 2); ctx.lineTo(1, 2); ctx.lineTo(-2, 12); ctx.lineTo(6, 0); ctx.lineTo(-1, 0); ctx.closePath(); ctx.fill();
                
                ctx.fillStyle = '#34d399'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center';
                ctx.fillText("Charging", 0, 25);
            } else {
                // Empty battery
                ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.roundRect(-10, -15, 20, 30, 2); ctx.stroke();
                ctx.fillStyle = '#64748b'; ctx.fillRect(-4, -18, 8, 3);
            }

            ctx.restore();
        }

        // --- Main Render Loop ---
        function render(time) {
            let dt = (time - lastTime) / 1000;
            if (dt > 0.1) dt = 0.1;
            lastTime = time;
            dashOffset -= 50 * dt; // Flow animation speed

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Calculate moving Wiper Y position based on slider (100% = Top, 0% = Bot)
            // Range from Y_TOP+40 to Y_BOT-40
            const actualWiperY = (Y_BOT - 40) - (potPercent / 100) * ((Y_BOT - 40) - (Y_TOP + 40));

            // --- Draw Solid Background Wires ---
            
            // Left to Switch
            drawSolidWire([{x: X_BAT, y: Y_TOP}, {x: X_SW - 25, y: Y_TOP}]);
            
            // Switch to Splits and Collector
            drawSolidWire([{x: X_SW + 25, y: Y_TOP}, {x: X_TRANS + 15, y: Y_TOP}]);
            
            // Base connection (from Potentiometer wiper to Transistor Base with orthogonal dogleg)
            drawSolidWire([
                {x: X_POT + 25, y: actualWiperY}, 
                {x: 375, y: actualWiperY}, 
                {x: 375, y: Y_WIPER}, 
                {x: X_TRANS - 35, y: Y_WIPER}
            ]);
            
            // Collector line dropping into Transistor (Fixed to connect perfectly without gaps)
            drawSolidWire([{x: X_TRANS + 15, y: Y_TOP}, {x: X_TRANS + 15, y: Y_WIPER - 35}]);

            // Emitter dropping down to Output Rail (Fixed to connect perfectly without gaps)
            drawSolidWire([{x: X_TRANS + 15, y: Y_WIPER + 35}, {x: X_TRANS + 15, y: Y_OUT}]);

            // Output Rail
            drawSolidWire([{x: X_TRANS + 15, y: Y_OUT}, {x: X_BR3, y: Y_OUT}]);

            // Ground Rail
            drawSolidWire([{x: X_BAT, y: Y_BOT}, {x: X_BR3, y: Y_BOT}]);

            // Draw Connection Nodes
            drawNode(X_POT, Y_TOP);
            drawNode(X_POT, Y_BOT);
            drawNode(X_TRANS + 15, Y_TOP);
            drawNode(X_TRANS + 15, Y_OUT);
            drawNode(X_BR1, Y_OUT);
            drawNode(X_BR1, Y_BOT);
            drawNode(X_BR2, Y_OUT);
            drawNode(X_BR2, Y_BOT);
            drawNode(X_BR3, Y_OUT);
            drawNode(X_BR3, Y_BOT);


            // --- Draw Animated Currents ---

            if (isPowerOn) {
                // Main flow from Battery through SW
                drawAnimWire([{x: X_BAT, y: Y_TOP}, {x: X_SW - 25, y: Y_TOP}]);
                drawAnimWire([{x: X_SW + 25, y: Y_TOP}, {x: X_TRANS + 15, y: Y_TOP}]);
                
                // Flow down into Potentiometer to Ground
                drawAnimWire([{x: X_POT, y: Y_TOP}, {x: X_POT, y: Y_BOT}]);
                
                // Flow into Base (proportional to voltage, orthogonal path)
                if (vBase > 0.1) {
                    drawAnimWire([
                        {x: X_POT + 25, y: actualWiperY}, 
                        {x: 375, y: actualWiperY}, 
                        {x: 375, y: Y_WIPER}, 
                        {x: X_TRANS - 35, y: Y_WIPER}
                    ]);
                }

                // If Transistor is ON, flow through Collector to Output
                if (vEmitter > 0) {
                    drawAnimWire([{x: X_TRANS + 15, y: Y_TOP}, {x: X_TRANS + 15, y: Y_WIPER - 35}]); // Into C
                    drawAnimWire([{x: X_TRANS + 15, y: Y_WIPER + 35}, {x: X_TRANS + 15, y: Y_OUT}]); // Out E
                    
                    // Spread along output rail
                    drawAnimWire([{x: X_TRANS + 15, y: Y_OUT}, {x: X_BR3, y: Y_OUT}]);
                }

                // Branch flows if enough voltage
                if (isCharging) {
                    // Branch 1 (LED)
                    drawAnimWire([{x: X_BR1, y: Y_OUT}, {x: X_BR1, y: Y_BOT}]);
                    // Branch 3 (Phone)
                    drawAnimWire([{x: X_BR3, y: Y_OUT}, {x: X_BR3, y: Y_BOT}]);
                }
                
                if (vEmitter > 0) {
                    // Branch 2 (Resistor) always flows a bit if Ve > 0
                    drawAnimWire([{x: X_BR2, y: Y_OUT}, {x: X_BR2, y: Y_BOT}]);
                }

                // Ground return path
                drawAnimWire([{x: X_BR3, y: Y_BOT}, {x: X_BAT, y: Y_BOT}]);
            }


            // --- Draw Components ---
            
            drawBattery(X_BAT, Y_TOP, Y_BOT);
            drawSwitch(X_SW, Y_TOP, isPowerOn);
            
            drawPotentiometer(X_POT, Y_TOP, Y_BOT, actualWiperY);
            
            // Note: Transistor is drawn statically at Y_WIPER, avoiding the disconnected gap issue
            drawTransistor(X_TRANS, Y_WIPER);

            // Output Branches
            drawLEDAndResistor(X_BR1, Y_OUT, Y_BOT, isCharging);
            drawVerticalResistor(X_BR2, Y_OUT, Y_BOT, "R1 6.8kΩ");
            drawPhone(X_BR3, Y_OUT, Y_BOT, isCharging);

            requestAnimationFrame(render);
        }

        // Init
        updateLogic();
        requestAnimationFrame(render);

    </script>
</body>
</html>
