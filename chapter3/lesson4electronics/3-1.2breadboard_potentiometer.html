<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breadboard Circuit Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Battambang', sans-serif;
            background-color: #f0fdf4; /* Light green tint for a fresh lab look */
        }

        /* SVG Styles */
        .wire-red { stroke: #ef4444; stroke-width: 4; fill: none; stroke-linecap: round; }
        .wire-black { stroke: #1f2937; stroke-width: 4; fill: none; stroke-linecap: round; }
        .wire-jumper { stroke: #3b82f6; stroke-width: 3; fill: none; stroke-linecap: round; }
        
        .hole { fill: #e2e8f0; stroke: #cbd5e1; stroke-width: 1; }
        .rail-red { stroke: #ef4444; stroke-width: 2; }
        .rail-blue { stroke: #3b82f6; stroke-width: 2; }

        /* Component Effects */
        .led-dome { transition: fill 0.2s; }
        .led-glow-effect {
            filter: drop-shadow(0 0 12px rgba(255, 0, 0, 0.9)) drop-shadow(0 0 24px rgba(255, 0, 0, 0.7));
            transition: opacity 0.2s ease-out;
        }
        
        #pot-dial {
            transform-origin: 365px 260px;
            transition: transform 0.1s linear;
        }

        /* Current Animation */
        @keyframes flowAnimation {
            to { stroke-dashoffset: -30; }
        }
        .current-flow {
            stroke: #fbbf24; /* Amber/Yellow for electron flow */
            stroke-width: 3;
            stroke-dasharray: 6 9;
            stroke-linecap: round;
            fill: none;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .current-flow.active {
            opacity: 1;
            animation: flowAnimation 0.6s linear infinite;
        }

        /* Custom UI Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 26px;
            width: 26px;
            border-radius: 50%;
            background: #2563eb;
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);
            border: 2px solid white;
        }
        input[type=range]:disabled::-webkit-slider-thumb {
            background: #9ca3af;
            cursor: not-allowed;
            box-shadow: none;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: #cbd5e1;
            border-radius: 4px;
        }

        /* Toggle Switch */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #10b981;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #10b981;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-8">

    <div class="bg-white rounded-3xl shadow-2xl max-w-6xl w-full overflow-hidden border border-gray-100 flex flex-col lg:flex-row">
        
        <!-- Left Side: Breadboard Simulation -->
        <div class="p-6 flex-[3] flex flex-col items-center bg-slate-50 border-b lg:border-b-0 lg:border-r border-gray-200 relative">
            <h2 class="text-2xl font-bold text-gray-800 mb-2 w-full text-center">តម្លើងសៀគ្វីលើបន្ទះ (Breadboard View)</h2>
            <p class="text-sm text-gray-500 mb-6 text-center">ពិនិត្យមើលការហូរនៃចរន្ត និងពន្លឺអំពូល</p>

            <div class="w-full relative bg-white rounded-xl shadow-inner overflow-hidden flex justify-center border border-gray-200" style="min-height: 400px;">
                <svg viewBox="0 0 800 500" class="w-full h-full drop-shadow-md">
                    <defs>
                        <!-- Breadboard Hole Pattern -->
                        <pattern id="hole-pattern" x="0" y="0" width="15" height="15" patternUnits="userSpaceOnUse">
                            <rect x="0" y="0" width="15" height="15" fill="none" />
                            <circle cx="7.5" cy="7.5" r="2.5" class="hole" />
                        </pattern>
                        <!-- Wood/Table background -->
                        <radialGradient id="table-glow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="100%" stop-color="#f8fafc"/>
                        </radialGradient>
                    </defs>

                    <!-- Background -->
                    <rect width="100%" height="100%" fill="url(#table-glow)"/>

                    <!-- BATTERY 9V -->
                    <g transform="translate(40, 250)">
                        <rect x="0" y="0" width="110" height="70" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
                        <!-- Battery Terminals -->
                        <rect x="15" y="-10" width="20" height="10" rx="2" fill="#94a3b8"/>
                        <rect x="75" y="-10" width="20" height="10" rx="2" fill="#94a3b8"/>
                        <circle cx="25" cy="-10" r="5" fill="#cbd5e1"/>
                        <path d="M78,-10 L92,-10 L85,-15 Z" fill="#cbd5e1"/>
                        <!-- Labels -->
                        <text x="55" y="30" class="text-xl font-bold font-sans" fill="#f8fafc" text-anchor="middle">9V</text>
                        <text x="55" y="55" class="text-sm font-bold" fill="#f8fafc" text-anchor="middle">ប្រភពអគ្គិសនី</text>
                        <text x="25" y="15" class="text-lg font-bold font-sans" fill="#ef4444" text-anchor="middle">+</text>
                        <text x="85" y="15" class="text-lg font-bold font-sans" fill="#3b82f6" text-anchor="middle">-</text>
                    </g>

                    <!-- BREADBOARD -->
                    <g transform="translate(180, 100)">
                        <!-- Board Base -->
                        <rect x="0" y="0" width="580" height="300" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.1))"/>
                        
                        <!-- Top Power Rails -->
                        <line x1="20" y1="20" x2="560" y2="20" class="rail-red"/>
                        <rect x="20" y="27" width="540" height="15" fill="url(#hole-pattern)"/>
                        
                        <line x1="20" y1="55" x2="560" y2="55" class="rail-blue"/>
                        <rect x="20" y="62" width="540" height="15" fill="url(#hole-pattern)"/>

                        <!-- Middle Terminal Strips (Top Half) -->
                        <rect x="20" y="100" width="540" height="75" fill="url(#hole-pattern)"/>
                        
                        <!-- Center Divider -->
                        <rect x="0" y="180" width="580" height="15" fill="#e2e8f0"/>
                        
                        <!-- Middle Terminal Strips (Bottom Half) -->
                        <rect x="20" y="200" width="540" height="75" fill="url(#hole-pattern)"/>

                    </g>

                    <!-- EXTERNAL WIRES -->
                    <!-- Battery + to Switch IN -->
                    <!-- We route it from Bat+ directly to the switch to make logic visual simpler -->
                    <path d="M 65,240 C 65,150 200,420 285,420" class="wire-red"/>
                    <!-- Battery - to Bottom Rail GND -->
                    <path d="M 125,240 C 125,200 180,155 200,165" class="wire-black"/>

                    <!-- COMPONENTS & JUMPERS -->
                    
                    <!-- Ground Jumper (LED Cathode to GND Rail) -->
                    <path d="M 502,330 C 502,280 440,250 440,165" class="wire-black"/>

                    <!-- Switch -->
                    <g transform="translate(260, 400)">
                        <rect x="0" y="0" width="50" height="30" rx="4" fill="#334155"/>
                        <rect x="25" y="-5" width="10" height="15" rx="2" fill="#94a3b8" id="switch-physical"/>
                        <circle cx="15" cy="15" r="4" fill="#cbd5e1"/>
                        <circle cx="35" cy="15" r="4" fill="#cbd5e1"/>
                        <!-- Pins -->
                        <line x1="25" y1="0" x2="25" y2="-20" stroke="#94a3b8" stroke-width="3"/>
                        <line x1="45" y1="0" x2="45" y2="-40" stroke="#94a3b8" stroke-width="3"/>
                        <text x="25" y="45" class="text-xs font-bold" fill="#334155" text-anchor="middle">កុងតាក់</text>
                    </g>
                    <!-- Wire: Switch OUT to Potentiometer IN -->
                    <path d="M 305,360 C 305,340 335,350 335,330" class="wire-jumper"/>

                    <!-- Potentiometer (100k) -->
                    <g transform="translate(320, 230)">
                        <!-- Body -->
                        <rect x="0" y="0" width="60" height="80" rx="8" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="2"/>
                        <!-- Legs -->
                        <rect x="10" y="80" width="6" height="20" fill="#94a3b8"/>
                        <rect x="27" y="80" width="6" height="20" fill="#94a3b8"/>
                        <rect x="44" y="80" width="6" height="20" fill="#94a3b8"/>
                        
                        <!-- Dial Background -->
                        <circle cx="30" cy="40" r="24" fill="#3b82f6"/>
                        <!-- Dial Rotatable Element -->
                        <g id="pot-dial">
                            <circle cx="30" cy="40" r="20" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
                            <!-- Indicator Line -->
                            <line x1="30" y1="40" x2="30" y2="20" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
                        </g>
                        <!-- Text -->
                        <text x="30" y="70" class="text-xs font-sans font-bold" fill="#fff" text-anchor="middle">100kΩ</text>
                        <text x="30" y="-10" class="text-sm font-bold" fill="#1e3a8a" text-anchor="middle">ប៉ូតង់ស្យូម៉ែត្រ</text>
                    </g>
                    
                    <!-- Wire: Pot OUT to Resistor IN -->
                    <path d="M 347,325 C 347,300 370,330 395,330" class="wire-jumper"/>

                    <!-- Resistor (220 Ohm) -->
                    <g transform="translate(395, 330)">
                        <!-- Left Wire -->
                        <line x1="0" y1="0" x2="20" y2="0" stroke="#94a3b8" stroke-width="3"/>
                        <!-- Right Wire -->
                        <line x1="60" y1="0" x2="85" y2="0" stroke="#94a3b8" stroke-width="3"/>
                        
                        <!-- Body (Beige) -->
                        <path d="M 20,-6 C 20,-8 30,-8 30,-6 L 50,-6 C 50,-8 60,-8 60,-6 L 60,6 C 60,8 50,8 50,6 L 30,6 C 30,8 20,8 20,6 Z" fill="#eaddcf" stroke="#d6c3ae" stroke-width="1"/>
                        
                        <!-- Color Bands (220 = Red, Red, Brown, Gold) -->
                        <rect x="25" y="-6.5" width="4" height="13" fill="#ef4444"/> <!-- Red -->
                        <rect x="35" y="-6.5" width="4" height="13" fill="#ef4444"/> <!-- Red -->
                        <rect x="45" y="-6.5" width="4" height="13" fill="#78350f"/> <!-- Brown -->
                        <rect x="53" y="-6.5" width="3" height="13" fill="#eab308"/> <!-- Gold -->
                        
                        <text x="40" y="-15" class="text-xs font-bold" fill="#475569" text-anchor="middle">២២០អូម</text>
                    </g>

                    <!-- LED -->
                    <g transform="translate(480, 275)">
                        <!-- Legs -->
                        <line x1="0" y1="40" x2="0" y2="55" stroke="#94a3b8" stroke-width="3"/> <!-- Anode (Long) -->
                        <line x1="22" y1="40" x2="22" y2="55" stroke="#94a3b8" stroke-width="3"/> <!-- Cathode (Short) -->
                        <rect x="20" y="38" width="5" height="12" fill="#fff" opacity="0.8"/> <!-- Short Leg Indicator/Flat edge -->
                        
                        <!-- Base -->
                        <path d="M -5,35 L 25,35 L 22,40 L 0,40 Z" fill="#64748b"/>
                        
                        <!-- Dome Background (Off State) -->
                        <path d="M -5,35 C -5,0 25,0 25,35 Z" fill="#fee2e2" stroke="#fca5a5" stroke-width="2" class="led-dome"/>
                        
                        <!-- Internal Diode Parts -->
                        <path d="M 0,40 L 0,25 L 8,25 L 8,30 Z" fill="#94a3b8"/> <!-- Anode Post -->
                        <path d="M 22,40 L 22,20 L 10,20 L 10,28 L 22,28 Z" fill="#94a3b8"/> <!-- Cathode Anvil -->
                        
                        <!-- Glow Overlay (Animated by JS) -->
                        <path id="led-glow-layer" d="M -5,35 C -5,0 25,0 25,35 Z" fill="#ef4444" class="led-glow-effect" opacity="0"/>
                        
                        <text x="10" y="-10" class="text-sm font-bold" fill="#ef4444" text-anchor="middle">អំពូល LED</text>
                    </g>

                    <!-- CURRENT FLOW ANIMATION PATH -->
                    <!-- Path traces from Bat+ -> Switch -> Pot Pin 1 -> Pot Pin 2 -> Resistor -> LED -> Ground Rail -> Bat- -->
                    <!-- We use a single continuous path to make the dashed animation flow smoothly -->
                    <path id="current-animation" d="
                        M 65,240 
                        C 65,150 200,420 285,420
                        L 285,400 
                        L 305,400 
                        L 305,360 C 305,340 335,350 335,330
                        L 335,310 L 347,310 L 347,325 C 347,300 370,330 395,330
                        L 480,330 
                        L 480,275
                        M 502,275
                        L 502,330 C 502,280 440,250 440,165
                        L 200,165 C 180,155 125,200 125,240
                    " class="current-flow" />
                    
                    <!-- Connecting the gap inside the LED mentally (since it breaks the path visually, we add a second flow line for the return path) -->
                    <path id="current-return" d="
                        M 502,275
                        L 502,330 C 502,280 440,250 440,165
                        L 200,165 C 180,155 125,200 125,240
                    " class="current-flow" />

                </svg>
            </div>
        </div>

        <!-- Right Side: Controls and Readouts -->
        <div class="p-6 md:p-8 flex-[2] flex flex-col justify-center bg-white">
            
            <div class="bg-gradient-to-r from-blue-600 to-blue-700 text-white p-5 rounded-2xl text-center mb-8 shadow-lg">
                <h1 class="text-2xl font-bold mb-2">បន្ទះពិសោធន៍ (Breadboard)</h1>
                <p class="text-blue-100 text-sm">សិក្សាពីការប្រើប្រាស់រេស៊ីស្តង់អថេរ</p>
            </div>

            <!-- Power Switch Control -->
            <div class="flex items-center justify-between bg-slate-50 border border-slate-200 p-5 rounded-2xl shadow-sm mb-8 transition-colors" id="panel-power">
                <div>
                    <div class="font-bold text-gray-800 text-lg mb-1">កុងតាក់ចរន្ត (Power)</div>
                    <div class="text-sm font-bold text-gray-500" id="power-status-text">ស្ថានភាព: បិទ (OFF)</div>
                </div>
                
                <div class="relative inline-block w-16 mr-2 align-middle select-none">
                    <input type="checkbox" name="toggle" id="power-toggle" class="toggle-checkbox absolute block w-8 h-8 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 transition-all duration-300" style="top: -4px; border-color: #cbd5e1;"/>
                    <label for="power-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-slate-300 cursor-pointer transition-colors duration-300"></label>
                </div>
            </div>

            <!-- Slider Control -->
            <div class="w-full bg-blue-50/50 rounded-2xl p-6 border border-blue-100 shadow-sm mb-8">
                <label for="pot-slider" class="flex justify-between text-gray-800 font-bold mb-4 text-lg">
                    <span>លៃតម្រូវប៉ូតង់ស្យូម៉ែត្រ</span>
                    <span id="slider-pct-label" class="text-blue-600">0.0%</span>
                </label>
                
                <!-- Range 0 to 100% -->
                <input type="range" id="pot-slider" min="0" max="100" step="0.1" value="0" class="w-full" disabled>
                
                <div class="flex justify-between text-xs text-slate-500 mt-3 font-bold px-1">
                    <span>0% (0Ω)</span>
                    <span>1%</span>
                    <span>2%</span>
                    <span>100%</span>
                </div>
            </div>

            <!-- Data Readouts -->
            <div class="w-full grid grid-cols-2 gap-4 text-center">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <div class="text-slate-500 text-xs font-bold mb-2 uppercase tracking-wider">រេស៊ីស្តង់សរុប (Pot+R)</div>
                    <div class="text-2xl font-bold text-blue-600 font-sans" id="val-ohm">220 Ω</div>
                </div>

                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <div class="text-slate-500 text-xs font-bold mb-2 uppercase tracking-wider">ស្ថានភាពពន្លឺ</div>
                    <div class="text-lg font-bold text-gray-400 transition-colors duration-200 mt-1" id="val-status">រលត់</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // DOM Elements setup
        const powerToggle = document.getElementById('power-toggle');
        const powerStatusText = document.getElementById('power-status-text');
        const panelPower = document.getElementById('panel-power');
        const slider = document.getElementById('pot-slider');
        const sliderPctLabel = document.getElementById('slider-pct-label');
        
        const ohmDisplay = document.getElementById('val-ohm');
        const statusDisplay = document.getElementById('val-status');
        
        // SVG Elements
        const ledGlowLayer = document.getElementById('led-glow-layer');
        const potDial = document.getElementById('pot-dial');
        const switchPhysical = document.getElementById('switch-physical');
        const animFlow1 = document.getElementById('current-animation');
        const animFlow2 = document.getElementById('current-return');

        const MAX_POT_OHMS = 100000; // 100kΩ
        const FIXED_R = 220; // 220Ω
        let isPowerOn = false;

        function updateSimulation() {
            let pct = parseFloat(slider.value);
            let potOhms = (pct / 100) * MAX_POT_OHMS;
            let totalOhms = potOhms + FIXED_R;

            // 1. Update Texts
            sliderPctLabel.innerText = pct.toFixed(1) + '%';
            ohmDisplay.innerText = Math.round(totalOhms).toLocaleString() + ' Ω';

            // 2. Rotate Potentiometer Dial
            // Map 0-100% to -140 degrees to +140 degrees
            let rotation = -140 + (pct / 100) * 280;
            potDial.setAttribute('transform', `rotate(${rotation})`);

            // 3. Logic for LED Brightness & Status
            let brightness = 0;
            let statusText = 'រលត់';
            let textColor = 'text-gray-400';

            if (isPowerOn) {
                // Based on standard experiment text: 0%=Bright, 1%=Dim, >=2%=Off/Faint
                if (pct === 0) {
                    brightness = 1.0;
                    statusText = 'ភ្លឺខ្លាំង'; // Bright
                    textColor = 'text-red-600';
                } else if (pct > 0 && pct <= 1) {
                    brightness = 1.0 - (pct * 0.5); // Gradients down
                    statusText = 'ភ្លឺខ្សោយ'; // Dim
                    textColor = 'text-red-500';
                } else if (pct > 1 && pct <= 2) {
                    brightness = 0.5 - ((pct - 1) * 0.4);
                    statusText = 'ភ្លឺខ្សោយ'; // Dim
                    textColor = 'text-red-400';
                } else {
                    brightness = 0.05; // Very faint or zero
                    statusText = 'មិនភ្លឺ'; // Off/Not lighting
                    textColor = 'text-gray-400';
                }
                
                // Show current animations
                animFlow1.classList.add('active');
                animFlow2.classList.add('active');
                
                // Physical switch position (slide left/right)
                switchPhysical.setAttribute('x', '15'); // Closed position

            } else {
                // OFF State
                brightness = 0;
                statusText = 'រលត់'; // OFF
                textColor = 'text-gray-400';
                
                // Hide current animations
                animFlow1.classList.remove('active');
                animFlow2.classList.remove('active');
                
                // Physical switch position
                switchPhysical.setAttribute('x', '25'); // Open position
            }

            // Apply Visuals
            statusDisplay.innerText = statusText;
            statusDisplay.className = `text-lg font-bold mt-1 transition-colors duration-200 ${textColor}`;
            ledGlowLayer.setAttribute('opacity', brightness);
        }

        // Listeners
        powerToggle.addEventListener('change', function(e) {
            isPowerOn = e.target.checked;
            slider.disabled = !isPowerOn;
            
            if (isPowerOn) {
                powerStatusText.innerText = 'ស្ថានភាព: បើក (ON)';
                powerStatusText.className = 'text-sm font-bold text-emerald-600';
                panelPower.classList.add('bg-emerald-50', 'border-emerald-200');
                panelPower.classList.remove('bg-slate-50', 'border-slate-200');
            } else {
                powerStatusText.innerText = 'ស្ថានភាព: បិទ (OFF)';
                powerStatusText.className = 'text-sm font-bold text-gray-500';
                panelPower.classList.remove('bg-emerald-50', 'border-emerald-200');
                panelPower.classList.add('bg-slate-50', 'border-slate-200');
            }
            updateSimulation();
        });

        slider.addEventListener('input', updateSimulation);

        // Init
        updateSimulation();
    </script>
</body>
</html>
