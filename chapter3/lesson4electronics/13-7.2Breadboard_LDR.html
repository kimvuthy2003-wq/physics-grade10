<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>សៀគ្វីអំពូលបំភ្លឺស្វ័យប្រវត្តិ លើបន្ទះ (Fixed Ground)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Battambang', sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .app-card {
            width: 100%;
            max-width: 1100px;
            background: #ffffff;
            border-radius: 1.5rem;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            max-height: 550px;
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }
        /* Sliders */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 22px;
            width: 22px;
            border-radius: 50%;
            cursor: pointer;
            margin-top: -7px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            border: 2px solid white;
        }
        #lightSlider::-webkit-slider-thumb { background: #f59e0b; }
        #potSlider::-webkit-slider-thumb { background: #3b82f6; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: #e2e8f0;
            border-radius: 4px;
        }
        .btn-switch {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }
        .btn-switch:active { transform: scale(0.96); }
        .sw-active {
            background-color: #059669 !important;
            color: white !important;
            border-color: #047857 !important;
        }
    </style>
</head>
<body>

    <div class="app-card">
        <!-- Header -->
        <div class="bg-indigo-700 text-white p-5 text-center">
            <h1 class="text-2xl font-bold tracking-wide">តម្លើងសៀគ្វីអំពូលបំភ្លឺស្វ័យប្រវត្តិនៅពេលយប់ លើបន្ទះ</h1>
            <p class="text-indigo-200 text-sm mt-1">សិក្សាពីដំណើរការត្រង់ស៊ីស្ទ័រ NPN, LDR និងប៉ូតង់ស្យូម៉ែត្រ</p>
        </div>

        <!-- Canvas Area -->
        <canvas id="breadboardCanvas" width="1000" height="500"></canvas>

        <!-- Lower Panel -->
        <div class="p-6 flex flex-col lg:flex-row gap-6 bg-slate-50 items-stretch">
            
            <!-- Controls -->
            <div class="flex flex-col gap-4 w-full lg:w-2/5 justify-center">
                <button id="btnPower" onclick="togglePower()" class="btn-switch py-3 px-5 rounded-xl font-bold text-slate-700 bg-white border-2 border-slate-300 shadow-sm flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <div class="w-4 h-4 rounded-full bg-emerald-500"></div>
                        <span>កុងតាក់ប្រភពអគ្គិសនី (SW)</span>
                    </div>
                    <span id="txtPower" class="text-sm px-3 py-1 bg-slate-100 text-slate-500 rounded-lg">បិទ (OFF)</span>
                </button>

                <div class="bg-amber-50 p-4 rounded-xl border border-amber-200 shadow-sm">
                    <label class="flex justify-between font-bold text-amber-800 mb-3 text-sm">
                        <span>ពន្លឺជះលើ LDR (Light)</span>
                        <span id="lightValText">ងងឹត</span>
                    </label>
                    <input type="range" id="lightSlider" min="0" max="100" value="0">
                    <div class="flex justify-between text-xs text-amber-600 mt-2 font-bold">
                        <span>យប់</span>
                        <span>ថ្ងៃ</span>
                    </div>
                </div>

                <div class="bg-blue-50 p-4 rounded-xl border border-blue-200 shadow-sm">
                    <label class="flex justify-between font-bold text-blue-800 mb-3 text-sm">
                        <span>ភាពញាប់សេនស័រ (Sensitivity Pot)</span>
                        <span id="potValText">50 kΩ</span>
                    </label>
                    <input type="range" id="potSlider" min="0" max="100" value="50">
                    <div class="flex justify-between text-xs text-blue-600 mt-2 font-bold">
                        <span>0 kΩ</span>
                        <span>100 kΩ</span>
                    </div>
                </div>
            </div>

            <!-- Analysis Box -->
            <div class="flex-1">
                <div class="h-full bg-white border border-slate-200 rounded-2xl p-6 shadow-sm transition-all duration-300 flex flex-col justify-center" id="infoPanel">
                    <h3 class="text-indigo-700 font-bold mb-3 flex items-center gap-2 text-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        ការសង្កេត និងវិភាគ៖
                    </h3>
                    <div id="explanationText" class="text-slate-700 text-[1.05rem] leading-relaxed font-bold">
                        <!-- Text injected via JS -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const canvas = document.getElementById('breadboardCanvas');
        const ctx = canvas.getContext('2d');
        const btnPower = document.getElementById('btnPower');
        const txtPower = document.getElementById('txtPower');
        const lightSlider = document.getElementById('lightSlider');
        const potSlider = document.getElementById('potSlider');
        const lightValText = document.getElementById('lightValText');
        const potValText = document.getElementById('potValText');
        const infoPanel = document.getElementById('infoPanel');
        const explanationText = document.getElementById('explanationText');

        // State Variables
        let isPowerOn = false;
        let isLedOn = false;
        let lightLevel = 0; 
        let potValue = 50;  
        let dashOffset = 0;
        let lastTime = performance.now();

        // Breadboard Grid Setup
        const B_X = 200, B_Y = 120; 
        const GRID = 20;

        // Hole Coordinate Helper
        function col(i) { return B_X + 30 + i * GRID; }
        
        // Exact rows for precision
        const ROW_TOP_RED  = B_Y + 15;
        const ROW_TOP_BLU  = B_Y + 45;
        function rowT(i) { return B_Y + 75 + i * GRID; }  // i=0 to 4
        function rowB(i) { return B_Y + 190 + i * GRID; } // i=0 to 4
        const ROW_BOT_BLU  = B_Y + 300; // Corrected to Blue Rail
        const ROW_BOT_RED  = B_Y + 330;

        const Y_VCC = ROW_TOP_RED;
        const Y_GND = ROW_BOT_BLU; // Ground is now strictly the Blue rail!

        // Logic
        function updateLogic() {
            lightLevel = parseInt(lightSlider.value);
            potValue = parseInt(potSlider.value);
            
            lightValText.innerText = lightLevel < 30 ? "ងងឹត" : (lightLevel > 70 ? "ភ្លឺ" : "ស្រទុំ");
            potValText.innerText = potValue + " kΩ";

            if (!isPowerOn) {
                isLedOn = false;
            } else {
                const rTop = 10 + potValue; 
                const rLDR = 500 * Math.exp(-0.08 * lightLevel) + 0.5; // Exponential drop
                const vBase = 9.0 * (rLDR / (rTop + rLDR));
                isLedOn = vBase >= 0.7; // Base threshold
            }
            updateUI();
        }

        function togglePower() {
            isPowerOn = !isPowerOn;
            updateLogic();
        }

        lightSlider.addEventListener('input', updateLogic);
        potSlider.addEventListener('input', updateLogic);

        function updateUI() {
            if (isPowerOn) {
                btnPower.classList.add('sw-active');
                txtPower.innerText = "បើក (ON)"; txtPower.className = "text-sm px-3 py-1 bg-white text-emerald-700 rounded-lg shadow-sm";
            } else {
                btnPower.classList.remove('sw-active');
                txtPower.innerText = "បិទ (OFF)"; txtPower.className = "text-sm px-3 py-1 bg-slate-100 text-slate-500 rounded-lg";
            }

            if (!isPowerOn) {
                infoPanel.className = "h-full bg-slate-100 border border-slate-200 rounded-2xl p-6 shadow-inner transition-all duration-300 flex flex-col justify-center";
                explanationText.innerHTML = `ផ្តាច់ប្រភពអគ្គិសនី (SW=OFF)៖ <br>សៀគ្វីទាំងមូលដាច់ចរន្តអគ្គិសនី។ អំពូល LED រលត់។`;
            } else if (isLedOn) {
                infoPanel.className = "h-full bg-blue-50 border border-blue-200 rounded-2xl p-6 shadow-sm transition-all duration-300 flex flex-col justify-center shadow-[0_0_15px_rgba(59,130,246,0.1)]";
                explanationText.innerHTML = `ពេលយប់ងងឹត៖ <br>LDR គ្មានពន្លឺ រេស៊ីស្តង់វាធំ ធ្វើឱ្យចរន្តហូរចុះម៉ាស់បានតិចតួច។ ចរន្តត្រូវបង្វែរចូលជើង B នៃត្រង់ស៊ីស្ទ័រ ធ្វើឱ្យវាដំណើរការទាញចរន្តកាត់ជើង C ទៅ E ទើប <span class="text-red-600 font-bold">អំពូល LED ភ្លឺ</span>។`;
            } else {
                infoPanel.className = "h-full bg-amber-50 border border-amber-200 rounded-2xl p-6 shadow-sm transition-all duration-300 flex flex-col justify-center shadow-[0_0_15px_rgba(245,158,11,0.1)]";
                explanationText.innerHTML = `ពេលថ្ងៃភ្លឺ៖ <br>LDR ត្រូវពន្លឺ រេស៊ីស្តង់វាចុះខ្សោយខ្លាំង។ ចរន្តអគ្គិសនីភាគច្រើនហូរឆ្លងកាត់ LDR ចុះម៉ាស់។ ជើង B ខ្វះចរន្ត ធ្វើឱ្យត្រង់ស៊ីស្ទ័រមិនដំណើរការ ទើប <span class="text-slate-500 font-bold">អំពូល LED រលត់</span>។`;
            }
        }

        // --- Drawing Helpers ---

        function drawBreadboard() {
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = 'rgba(0,0,0,0.08)';
            ctx.shadowBlur = 20;
            ctx.shadowOffsetY = 8;
            ctx.beginPath();
            ctx.roundRect(B_X, B_Y, 740, 360, 12);
            ctx.fill();
            ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2; ctx.stroke();

            // Colored Power Rails (Lines slightly offset from holes)
            ctx.strokeStyle = '#ef4444'; ctx.beginPath(); ctx.moveTo(B_X + 20, B_Y + 5); ctx.lineTo(B_X + 720, B_Y + 5); ctx.stroke(); // Top Red
            ctx.strokeStyle = '#3b82f6'; ctx.beginPath(); ctx.moveTo(B_X + 20, B_Y + 35); ctx.lineTo(B_X + 720, B_Y + 35); ctx.stroke(); // Top Blue
            ctx.strokeStyle = '#3b82f6'; ctx.beginPath(); ctx.moveTo(B_X + 20, B_Y + 290); ctx.lineTo(B_X + 720, B_Y + 290); ctx.stroke(); // Bot Blue
            ctx.strokeStyle = '#ef4444'; ctx.beginPath(); ctx.moveTo(B_X + 20, B_Y + 320); ctx.lineTo(B_X + 720, B_Y + 320); ctx.stroke(); // Bot Red

            // Center Divider
            ctx.fillStyle = '#f1f5f9'; ctx.fillRect(B_X, B_Y + 170, 740, 15);

            // Holes
            ctx.fillStyle = '#cbd5e1';
            for (let c = 0; c < 34; c++) {
                if (c % 6 === 5) continue; // Gap
                
                // Top power holes
                ctx.beginPath(); ctx.rect(col(c) - 2, ROW_TOP_RED - 2, 4, 4); ctx.fill();
                ctx.beginPath(); ctx.rect(col(c) - 2, ROW_TOP_BLU - 2, 4, 4); ctx.fill();
                
                // Terminal holes
                for (let r = 0; r <= 4; r++) {
                    ctx.beginPath(); ctx.rect(col(c) - 2, rowT(r) - 2, 4, 4); ctx.fill();
                    ctx.beginPath(); ctx.rect(col(c) - 2, rowB(r) - 2, 4, 4); ctx.fill();
                }

                // Bottom power holes
                ctx.beginPath(); ctx.rect(col(c) - 2, ROW_BOT_BLU - 2, 4, 4); ctx.fill();
                ctx.beginPath(); ctx.rect(col(c) - 2, ROW_BOT_RED - 2, 4, 4); ctx.fill();
            }
        }

        function drawBattery() {
            const bx = 40, by = 160;
            ctx.fillStyle = '#1e293b';
            ctx.beginPath(); ctx.roundRect(bx, by, 110, 70, 8); ctx.fill();
            ctx.fillStyle = '#94a3b8';
            ctx.beginPath(); ctx.roundRect(bx + 110, by + 10, 10, 20, 2); ctx.fill(); // +
            ctx.beginPath(); ctx.roundRect(bx + 110, by + 40, 10, 20, 2); ctx.fill(); // -
            
            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 24px Arial'; ctx.fillText('9V', bx + 40, by + 45);
            ctx.fillStyle = '#ef4444'; ctx.font = 'bold 18px Arial'; ctx.fillText('+', bx + 125, by + 26);
            ctx.fillStyle = '#3b82f6'; ctx.fillText('-', bx + 125, by + 56);

            // Wiring to Breadboard (Switched VCC)
            if (isPowerOn) {
                drawOrthoWire({x: bx + 115, y: by + 20}, {x: col(0), y: Y_VCC}, '#ef4444');
            } else {
                drawOrthoWire({x: bx + 115, y: by + 20}, {x: bx + 115, y: by - 30}, '#ef4444'); // Dangling
            }
            // Bat(-) -> Bot Blue Rail
            drawOrthoWire({x: bx + 115, y: by + 50}, {x: col(0), y: Y_GND}, '#1e293b'); 
        }

        function drawOrthoWire(p1, p2, color, isDashed = false) {
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            
            if (p1.y < p2.y) {
                const midY = p1.y + (p2.y - p1.y)/2;
                ctx.lineTo(p1.x, midY); ctx.lineTo(p2.x, midY); ctx.lineTo(p2.x, p2.y);
            } else {
                const midY = p2.y + (p1.y - p2.y)/2;
                ctx.lineTo(p1.x, midY); ctx.lineTo(p2.x, midY); ctx.lineTo(p2.x, p2.y);
            }
            
            ctx.strokeStyle = color;
            ctx.lineWidth = 3.5;
            ctx.lineCap = 'square';
            ctx.lineJoin = 'miter';
            if (isDashed) {
                ctx.setLineDash([8, 12]);
                ctx.lineDashOffset = dashOffset;
            }
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Metal pins
            ctx.fillStyle = '#94a3b8';
            ctx.fillRect(p1.x - 1.5, p1.y, 3, 10);
            ctx.fillRect(p2.x - 1.5, p2.y, 3, 10);
        }

        function drawPath(points, color, width, isDashed=false) {
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for(let i=1; i<points.length; i++) ctx.lineTo(points[i].x, points[i].y);
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            if(isDashed) { ctx.setLineDash([8,14]); ctx.lineDashOffset = dashOffset; }
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawResistor(p1, p2, colors) {
            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();

            const midX = (p1.x + p2.x) / 2;
            const midY = (p1.y + p2.y) / 2;
            
            ctx.save(); ctx.translate(midX, midY);
            ctx.rotate(Math.atan2(p2.y - p1.y, p2.x - p1.x));
            
            ctx.fillStyle = '#eaddcf'; ctx.strokeStyle = '#d6c3ae'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.roundRect(-22, -7, 44, 14, 4); ctx.fill(); ctx.stroke();
            
            ctx.fillStyle = colors[0]; ctx.fillRect(-16, -7, 4, 14);
            ctx.fillStyle = colors[1]; ctx.fillRect(-6, -7, 4, 14);
            ctx.fillStyle = colors[2]; ctx.fillRect(4, -7, 4, 14);
            ctx.fillStyle = '#eab308'; ctx.fillRect(14, -7, 4, 14); // Gold
            ctx.restore();
        }

        function drawLED(pA, pC, isOn) {
            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pA.x, pA.y - 30); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(pC.x, pC.y); ctx.lineTo(pC.x, pC.y - 30); ctx.stroke();

            const midX = (pA.x + pC.x) / 2;
            const midY = pA.y - 45;

            ctx.save(); ctx.translate(midX, midY);

            // Glow
            if (isOn) {
                ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(239, 68, 68, 0.4)'; ctx.fill();
                ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 15;
            }

            // Dome
            ctx.fillStyle = isOn ? '#ef4444' : '#fca5a5';
            ctx.strokeStyle = '#b91c1c'; ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(-10, 15);
            ctx.bezierCurveTo(-10, -15, 10, -15, 10, 15);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            ctx.shadowBlur = 0;

            // Flat edge (Cathode side, right)
            ctx.fillStyle = '#b91c1c';
            ctx.fillRect(8, 0, 3, 10);
            ctx.restore();
        }

        function drawTransistor(pE, pB, pC) {
            const px = pB.x; 
            const py = pB.y - 35;

            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(pE.x, pE.y); ctx.lineTo(pE.x, py + 10); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(pB.x, pB.y); ctx.lineTo(pB.x, py + 10); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(pC.x, pC.y); ctx.lineTo(pC.x, py + 10); ctx.stroke();

            ctx.save(); ctx.translate(px, py);
            ctx.fillStyle = '#111827';
            ctx.beginPath(); ctx.moveTo(-16, 0); ctx.bezierCurveTo(-16, -30, 16, -30, 16, 0); ctx.closePath(); ctx.fill();
            
            ctx.fillStyle = '#cbd5e1'; ctx.font = '10px Arial'; ctx.textAlign = 'center';
            ctx.fillText('2N3904', 0, -8);
            ctx.restore();
        }

        function drawLDR(p1, p2, lightLvl) {
            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p1.x, p1.y - 30); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(p2.x, p2.y); ctx.lineTo(p2.x, p2.y - 30); ctx.stroke();

            const midX = (p1.x + p2.x) / 2;
            const midY = p1.y - 40;

            ctx.save(); ctx.translate(midX, midY);
            ctx.fillStyle = '#f8fafc'; ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            
            ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.moveTo(-10, -10); ctx.lineTo(-5, -2); ctx.lineTo(0, -10); ctx.lineTo(5, -2); ctx.lineTo(10, -10); ctx.stroke();

            // Light Rays
            ctx.globalAlpha = 0.2 + (lightLvl / 100) * 0.8;
            ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-25, -20); ctx.lineTo(-15, -10);
            ctx.moveTo(-15, -25); ctx.lineTo(-10, -15);
            ctx.stroke();
            ctx.globalAlpha = 1.0;
            ctx.restore();
        }

        function drawTrimpot(p1, pW, p2, pct) {
            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p1.x, p1.y - 20); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(pW.x, pW.y); ctx.lineTo(pW.x, pW.y - 20); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(p2.x, p2.y); ctx.lineTo(p2.x, p2.y - 20); ctx.stroke();

            const midX = pW.x;
            const midY = pW.y - 30;

            ctx.save(); ctx.translate(midX, midY);
            ctx.fillStyle = '#3b82f6';
            ctx.beginPath(); ctx.roundRect(-15, -10, 30, 20, 2); ctx.fill();
            
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI*2); ctx.fill();
            
            ctx.rotate((pct / 100) * Math.PI * 1.5 - Math.PI*0.75);
            ctx.fillStyle = '#0f172a';
            ctx.beginPath(); ctx.moveTo(-2, -2); ctx.lineTo(2, -2); ctx.lineTo(0, -6); ctx.closePath(); ctx.fill();
            ctx.restore();
        }

        // --- Main Render Loop ---
        function render(time) {
            let dt = (time - lastTime) / 1000;
            if (dt > 0.1) dt = 0.1;
            lastTime = time;
            dashOffset -= 40 * dt;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawBreadboard();
            drawBattery();

            // --- Layout Placement ---
            
            // 1. R1 (220R): VCC -> Col 10
            const nR1_in = {x: col(10), y: Y_VCC};
            const nR1_out = {x: col(10), y: rowT(0)};
            drawResistor(nR1_in, nR1_out, ['#ef4444', '#ef4444', '#78350f']);

            // 2. LED: Col 10 -> Col 14
            const nLed_A = {x: col(10), y: rowT(2)};
            const nLed_C = {x: col(14), y: rowT(2)};
            drawLED(nLed_A, nLed_C, isLedOn);

            // 3. R2 (10k): VCC -> Col 25
            const nR2_in = {x: col(25), y: Y_VCC};
            const nR2_out = {x: col(25), y: rowT(0)};
            drawResistor(nR2_in, nR2_out, ['#78350f', '#000000', '#f59e0b']);

            // 4. Potentiometer: Col 25, 26, 27
            const nPot_1 = {x: col(25), y: rowT(2)};
            const nPot_W = {x: col(26), y: rowT(2)};
            const nPot_2 = {x: col(27), y: rowT(2)};
            drawTrimpot(nPot_1, nPot_W, nPot_2, potValue);

            // 5. Transistor Q1: Col 16(E), 17(B), 18(C) at Bottom
            const nQ1_E = {x: col(16), y: rowB(2)};
            const nQ1_B = {x: col(17), y: rowB(2)};
            const nQ1_C = {x: col(18), y: rowB(2)};
            drawTransistor(nQ1_E, nQ1_B, nQ1_C);

            // 6. LDR: Col 17(B) -> Col 21
            const nLdr_1 = {x: col(17), y: rowB(4)};
            const nLdr_2 = {x: col(21), y: rowB(4)};
            drawLDR(nLdr_1, nLdr_2, lightLevel);

            // 7. Orthogonal Jumpers
            const gapY1 = B_Y + 175; // Top half of gap
            const gapY2 = B_Y + 185; // Bottom half of gap

            // LED Cathode (14) to Q1 Collector (18)
            const pLedOut = {x: col(14), y: rowT(4)};
            const pQ1CIn = {x: col(18), y: rowB(0)};
            drawPath([pLedOut, {x: col(14), y: gapY1}, {x: col(18), y: gapY1}, pQ1CIn], '#334155', 3.5);

            // Pot Wiper (26) to Q1 Base (17)
            const pPotOut = {x: col(26), y: rowT(4)};
            const pQ1BIn = {x: col(17), y: rowB(0)};
            drawPath([pPotOut, {x: col(26), y: gapY2}, {x: col(17), y: gapY2}, pQ1BIn], '#3b82f6', 3.5);

            // FIX: Q1 Emitter (16) to GND (Bottom BLUE Rail)
            const pQ1EOut = {x: col(16), y: rowB(4)};
            const pQ1EGnd = {x: col(16), y: Y_GND};
            drawOrthoWire(pQ1EOut, pQ1EGnd, '#1e293b'); // Black Wire

            // FIX: LDR (21) to GND (Bottom BLUE Rail)
            const pLdrOut = {x: col(21), y: rowB(4)};
            const pLdrGnd = {x: col(21), y: Y_GND};
            drawOrthoWire(pLdrOut, pLdrGnd, '#1e293b'); // Black Wire


            // --- Flow Animations ---
            if (isPowerOn) {
                // Base Bias Path
                drawPath([nR2_in, nR2_out, nPot_1, nPot_W, pPotOut, {x: col(26), y: gapY2}, {x: col(17), y: gapY2}, pQ1BIn, nQ1_B], '#f59e0b', 4, true);
                
                if (isLedOn) {
                    // Main LED Path
                    drawPath([nR1_in, nR1_out, nLed_A, nLed_C, pLedOut, {x: col(14), y: gapY1}, {x: col(18), y: gapY1}, pQ1CIn, nQ1_C], '#ef4444', 4, true);
                    // Emitter Return
                    drawPath([nQ1_E, pQ1EOut, pQ1EGnd], '#f59e0b', 4, true);
                } else {
                    // LDR Bypass Path (Dark state bypass)
                    drawPath([nQ1_B, nLdr_1, nLdr_2, pLdrOut, pLdrGnd], '#f59e0b', 4, true);
                }
            }

            requestAnimationFrame(render);
        }

        // Init
        updateLogic();
        requestAnimationFrame(render);

    </script>
</body>
</html>
