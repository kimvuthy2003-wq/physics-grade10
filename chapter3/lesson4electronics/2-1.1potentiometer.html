<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potentiometer Simulator with Current Flow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Battambang', sans-serif;
            background-color: #f3f4f6;
        }
        
        .led-glow-effect {
            filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.8)) drop-shadow(0 0 20px rgba(255, 0, 0, 0.6));
            transition: all 0.2s ease-out;
        }

        /* Custom Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            transition: background 0.15s;
        }
        input[type=range]:disabled::-webkit-slider-thumb {
            background: #9ca3af;
            cursor: not-allowed;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: #cbd5e1;
            border-radius: 4px;
        }

        /* Current Flow Animation */
        @keyframes dashFlow {
            to {
                stroke-dashoffset: -24;
            }
        }
        .current-flow {
            stroke: #eab308; /* Yellow dots for current */
            stroke-width: 4;
            stroke-dasharray: 6 18;
            stroke-linecap: round;
            animation: dashFlow 0.8s linear infinite;
            fill: none;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .current-flow.off {
            opacity: 0;
            animation: none;
        }

        /* Switch Animation */
        #switch-lever {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: 50px 130px;
        }
        .switch-open {
            transform: rotate(-35deg);
        }
        .switch-closed {
            transform: rotate(0deg);
        }
        
        /* Toggle Button Styles */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #22c55e;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #22c55e;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl max-w-4xl w-full overflow-hidden border border-gray-200 flex flex-col md:flex-row">
        
        <!-- Left Side: Circuit Schematic -->
        <div class="p-6 md:p-8 flex-1 flex flex-col items-center border-b md:border-b-0 md:border-r border-gray-100 bg-gray-50">
            <h2 class="text-xl font-bold mb-4 text-gray-800 w-full text-center">សៀគ្វី (Circuit Diagram)</h2>
            
            <div class="w-full max-w-lg relative bg-white rounded-xl p-4 border border-gray-200 shadow-sm">
                <svg viewBox="0 0 400 280" class="w-full h-auto drop-shadow-sm">
                    
                    <!-- BASE WIRES (Static) -->
                    <!-- Batt+ to Switch -->
                    <polyline points="50,170 50,130" fill="none" stroke="#333" stroke-width="3"/>
                    
                    <!-- Switch to Pot A -->
                    <polyline points="50,90 50,50 150,50" fill="none" stroke="#333" stroke-width="3"/>
                    
                    <!-- Pot A to Pot B (Fixed resistor track) -->
                    <polyline points="150,50 160,35 170,65 180,35 190,65 200,35 210,65 220,35 230,65 240,35 250,50" fill="none" stroke="#333" stroke-width="3"/>
                    
                    <!-- LED Drop & fixed Resistor R1 -->
                    <polyline points="350,80 350,100" fill="none" stroke="#333" stroke-width="3"/>
                    <polyline points="350,140 350,220 250,220" fill="none" stroke="#333" stroke-width="3"/>
                    <polyline points="250,220 240,205 230,235 220,205 210,235 200,205 190,235 180,205 170,235 160,205 150,220" fill="none" stroke="#333" stroke-width="3"/>
                    
                    <!-- Return to Battery -->
                    <polyline points="150,220 50,220 50,200" fill="none" stroke="#333" stroke-width="3"/>

                    <!-- COMPONENTS -->
                    <!-- Battery 9V -->
                    <line x1="30" y1="170" x2="70" y2="170" stroke="#333" stroke-width="3"/>
                    <line x1="20" y1="185" x2="80" y2="185" stroke="#333" stroke-width="5"/>
                    <line x1="30" y1="200" x2="70" y2="200" stroke="#333" stroke-width="3"/>
                    
                    <!-- Switch Lever -->
                    <circle cx="50" cy="130" r="4" fill="#333"/>
                    <circle cx="50" cy="90" r="4" fill="#333"/>
                    <line id="switch-lever" x1="50" y1="130" x2="50" y2="90" stroke="#2563eb" stroke-width="5" stroke-linecap="round" class="switch-open"/>

                    <!-- Potentiometer Wiper & Dynamic Wire -->
                    <g id="wiper-group" transform="translate(0, 0)">
                        <line x1="150" y1="50" x2="150" y2="80" stroke="#ef4444" stroke-width="3"/>
                        <polygon points="145,70 155,70 150,80" fill="#ef4444"/>
                    </g>
                    <line id="wiper-wire" x1="150" y1="80" x2="350" y2="80" stroke="#333" stroke-width="3"/>

                    <!-- LED Component -->
                    <circle cx="350" cy="120" r="25" fill="#f8fafc" stroke="#333" stroke-width="2"/>
                    <circle id="led-glow" cx="350" cy="120" r="20" fill="red" opacity="0" class="led-glow-effect"/>
                    <!-- Diode pointing down -->
                    <polygon points="340,110 360,110 350,125" fill="#333"/>
                    <line x1="340" y1="125" x2="360" y2="125" stroke="#333" stroke-width="3"/>
                    
                    <!-- Light Emission Arrows (Pointing Outwards) -->
                    <g id="led-arrows" stroke="#ef4444" stroke-width="2" stroke-linecap="round" fill="none" opacity="0">
                        <!-- Upper Arrow -->
                        <line x1="375" y1="105" x2="395" y2="85" />
                        <polygon points="395,85 395,93 387,85" fill="#ef4444" stroke="none" />
                        <!-- Lower Arrow -->
                        <line x1="380" y1="120" x2="400" y2="100" />
                        <polygon points="400,100 400,108 392,100" fill="#ef4444" stroke="none" />
                    </g>

                    <!-- CURRENT FLOW OVERLAYS -->
                    <!-- Path 1: Batt+ to Pot A (Shown only when switch is closed) -->
                    <path id="flow-path-1" d="M 50,170 L 50,50 L 150,50" class="current-flow off" />
                    <!-- Path 2: Dynamically calculated from A -> C -> LED -> R1 -> Batt- -->
                    <path id="flow-path-2" d="" class="current-flow off" />

                    <!-- LABELS -->
                    <text x="15" y="165" class="text-sm font-bold" fill="#333">9V</text>
                    <text x="15" y="175" class="text-xs font-bold" fill="#ef4444">+</text>
                    <text x="15" y="205" class="text-xs font-bold" fill="#3b82f6">-</text>
                    
                    <text x="70" y="115" class="text-sm font-bold" fill="#2563eb">កុងតាក់</text>
                    
                    <text x="140" y="45" class="text-xs font-bold" fill="#333">A</text>
                    <text x="255" y="45" class="text-xs font-bold" fill="#333">B</text>
                    <text x="145" y="95" class="text-xs font-bold" fill="#ef4444">C</text>
                    
                    <text x="180" y="20" class="text-sm font-bold" fill="#333">Pot-HG: 100kΩ</text>
                    <text x="185" y="255" class="text-sm font-bold" fill="#333">R1 (220Ω)</text>
                    <text x="340" y="165" class="text-sm font-bold" fill="#333">LED</text>
                </svg>
            </div>
        </div>

        <!-- Right Side: Controls and Readouts -->
        <div class="p-6 md:p-8 flex-1 flex flex-col justify-center">
            
            <div class="bg-blue-600 text-white p-4 rounded-xl text-center mb-6 shadow">
                <h1 class="text-xl font-bold mb-1">ពិសោធន៍ ប៉ូតង់ស្យូម៉ែត្រ</h1>
                <p class="text-blue-100 text-sm">ការសិក្សាពីឥទ្ធិពលនៃរេស៊ីស្តង់អថេរ</p>
            </div>

            <!-- Power Switch Control -->
            <div class="flex items-center justify-between bg-white border border-gray-200 p-4 rounded-xl shadow-sm mb-6">
                <div>
                    <div class="font-bold text-gray-800 text-lg">កុងតាក់ចរន្ត (Power)</div>
                    <div class="text-sm text-gray-500" id="power-status-text">បច្ចុប្បន្ន: បិទ (OFF)</div>
                </div>
                
                <div class="relative inline-block w-16 mr-2 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" name="toggle" id="power-toggle" class="toggle-checkbox absolute block w-8 h-8 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 transition-all duration-300" style="top: -4px; border-color: #cbd5e1;"/>
                    <label for="power-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer transition-colors duration-300"></label>
                </div>
            </div>

            <!-- Slider Control -->
            <div class="w-full bg-blue-50 rounded-xl p-5 border border-blue-100 shadow-sm mb-6">
                <label for="pot-slider" class="block text-gray-800 font-bold mb-3 text-lg">
                    កែប្រែតម្លៃប៉ូតង់ស្យូម៉ែត្រ (0-100%)
                </label>
                
                <!-- Range 0 to 100% -->
                <input type="range" id="pot-slider" min="0" max="100" step="0.1" value="0" class="w-full" disabled>
                
                <div class="flex justify-between text-xs text-gray-500 mt-2 font-bold">
                    <span>0% (0Ω)</span>
                    <span>1%</span>
                    <span>2%</span>
                    <span>100%</span>
                </div>
            </div>

            <!-- Data Readouts -->
            <div class="w-full grid grid-cols-2 gap-4 text-center">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                    <div class="text-gray-500 text-xs font-bold mb-1 uppercase tracking-wider">ទីតាំង C</div>
                    <div class="text-2xl font-bold text-blue-600" id="val-pct">0.0 %</div>
                </div>
                
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                    <div class="text-gray-500 text-xs font-bold mb-1 uppercase tracking-wider">រេស៊ីស្តង់អថេរ</div>
                    <div class="text-2xl font-bold text-blue-600" id="val-ohm">0 Ω</div>
                </div>

                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 col-span-2">
                    <div class="text-gray-500 text-xs font-bold mb-1 uppercase tracking-wider">ស្ថានភាពអំពូល LED</div>
                    <div class="text-2xl font-bold text-gray-400 transition-colors duration-200" id="val-status">រលត់</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // DOM Elements
        const powerToggle = document.getElementById('power-toggle');
        const powerStatusText = document.getElementById('power-status-text');
        const slider = document.getElementById('pot-slider');
        
        const pctDisplay = document.getElementById('val-pct');
        const ohmDisplay = document.getElementById('val-ohm');
        const statusDisplay = document.getElementById('val-status');
        
        const switchLever = document.getElementById('switch-lever');
        const ledGlow = document.getElementById('led-glow');
        const ledArrows = document.getElementById('led-arrows');
        
        const wiperGroup = document.getElementById('wiper-group');
        const wiperWire = document.getElementById('wiper-wire');
        const flowPath1 = document.getElementById('flow-path-1');
        const flowPath2 = document.getElementById('flow-path-2');

        const MAX_OHMS = 100000; // 100kΩ
        let isPowerOn = false;

        function updateCircuit() {
            // Read values
            let pct = parseFloat(slider.value);
            let ohms = (pct / 100) * MAX_OHMS;

            // 1. Update UI Text for resistance & position
            pctDisplay.innerText = pct.toFixed(1) + ' %';
            ohmDisplay.innerText = Math.round(ohms).toLocaleString() + ' Ω';

            // 2. Adjust Visual Potentiometer Components
            // The wiper moves along X from 150 to 250 (range of 100 units = 100%)
            wiperGroup.setAttribute('transform', `translate(${pct}, 0)`);
            wiperWire.setAttribute('x1', 150 + pct);

            // 3. Compute dynamic current path for Path 2
            // Route: A(150,50) -> C(150+pct, 50) -> WiperDrop(150+pct, 80) -> LED(350, 80) -> LEDDrop(350,100) 
            // (skip LED body gap for nice visual) -> LEDBot(350,140) -> R1 -> Batt-
            let path2D = `M 150,50 
                          L ${150 + pct},50 
                          L ${150 + pct},80 
                          L 350,80 
                          L 350,100 
                          M 350,140 
                          L 350,220 
                          L 250,220 
                          M 150,220 
                          L 50,220 
                          L 50,200`;
            flowPath2.setAttribute('d', path2D);

            // 4. Handle Logic based on Power and Slider Position
            let brightness = 0;
            let statusText = 'រលត់';
            let textColor = 'text-gray-400';

            if (isPowerOn) {
                // Image logic: 
                // 0% -> Brightest (ភ្លឺខ្លាំង)
                // ~1% -> Dim (ភ្លឺខ្សោយ)
                // >= 2% -> Off or very dim (ភ្លឺខ្សោយខ្លាំងឬមិនភ្លឺ)
                if (pct === 0) {
                    brightness = 1.0;
                    statusText = 'ភ្លឺខ្លាំង (Bright)';
                    textColor = 'text-red-600';
                } else if (pct > 0 && pct <= 1) {
                    // Dim smoothly between 0 and 1
                    brightness = 1.0 - (pct * 0.6); 
                    statusText = 'ភ្លឺខ្សោយ (Dim)';
                    textColor = 'text-red-400';
                } else if (pct > 1 && pct < 2) {
                    brightness = 0.4 - ((pct - 1) * 0.4);
                    statusText = 'ភ្លឺខ្សោយ (Dim)';
                    textColor = 'text-red-400';
                } else {
                    // >= 2%
                    brightness = 0.0;
                    statusText = 'ភ្លឺខ្សោយខ្លាំងឬមិនភ្លឺ (Off/Faint)';
                    textColor = 'text-gray-400';
                }
                
                // Show current flow animation
                flowPath1.classList.remove('off');
                // Only show current flow if it's not completely blocked. 
                // (Though technically current always flows, at high resistance it's negligible. We'll leave it animated to show closed circuit).
                flowPath2.classList.remove('off');
                
            } else {
                // Circuit is OFF
                brightness = 0;
                statusText = 'រលត់ (OFF)';
                textColor = 'text-gray-400';
                
                // Hide current flow animation
                flowPath1.classList.add('off');
                flowPath2.classList.add('off');
            }

            // 5. Apply Status to UI
            statusDisplay.innerText = statusText;
            statusDisplay.className = `text-2xl font-bold transition-colors duration-200 ${textColor}`;

            // 6. Apply Brightness to LED SVG
            ledGlow.setAttribute('opacity', brightness);
            ledArrows.setAttribute('opacity', brightness > 0.05 ? brightness : 0);
        }

        // Toggle Event Listener
        powerToggle.addEventListener('change', function(e) {
            isPowerOn = e.target.checked;
            slider.disabled = !isPowerOn;
            
            if (isPowerOn) {
                switchLever.classList.replace('switch-open', 'switch-closed');
                powerStatusText.innerText = 'បច្ចុប្បន្ន: បើក (ON)';
                powerStatusText.className = 'text-sm font-bold text-green-600';
            } else {
                switchLever.classList.replace('switch-closed', 'switch-open');
                powerStatusText.innerText = 'បច្ចុប្បន្ន: បិទ (OFF)';
                powerStatusText.className = 'text-sm text-gray-500';
            }
            updateCircuit();
        });

        // Slider Event Listener
        slider.addEventListener('input', updateCircuit);

        // Initialize display
        updateCircuit();
    </script>
</body>
</html>
