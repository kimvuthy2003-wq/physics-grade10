<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>សៀគ្វីអគ្គិសនីសេរីនិងខ្នែង</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Battambang', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
        }
        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #334155;
            outline: none;
            transition: opacity .2s;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        .slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        svg text {
            font-family: sans-serif;
            user-select: none;
        }
        .glow {
            filter: drop-shadow(0 0 4px rgba(239, 68, 68, 0.8));
        }
        .value-box {
            fill: #1e293b;
            stroke: #38bdf8;
            stroke-width: 1;
            rx: 4;
        }
        .value-text {
            fill: #38bdf8;
            font-size: 12px;
            font-weight: bold;
        }

        /* ----------------------------------
           ចលនារបស់ចរន្តអគ្គិសនី (Animation)
        ----------------------------------- */
        @keyframes flow {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: -12; }
        }
        
        .running .wire-series {
            stroke-dasharray: 6, 6;
            animation: flow var(--series-speed, 1s) linear infinite;
        }
        .running .wire-parallel-main {
            stroke-dasharray: 6, 6;
            animation: flow var(--parallel-speed-main, 1s) linear infinite;
        }
        .running .wire-parallel-b1 {
            stroke-dasharray: 6, 6;
            animation: flow var(--parallel-speed-b1, 1s) linear infinite;
        }
        .running .wire-parallel-b2 {
            stroke-dasharray: 6, 6;
            animation: flow var(--parallel-speed-b2, 1s) linear infinite;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <header class="text-center mb-8">
        <h1 class="text-3xl md:text-4xl font-bold text-sky-400 mb-2">សៀគ្វីអគ្គិសនី</h1>
        <p class="text-gray-400 text-lg">ការប្រៀបធៀបរវាងសៀគ្វីតជាស៊េរី និងតជាខ្នែង</p>
        
        <!-- ប៊ូតុងបញ្ជាចរន្ត -->
        <div class="flex justify-center mt-6">
            <button id="toggleBtn" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-full shadow-[0_0_15px_rgba(16,185,129,0.5)] transition-all duration-300 flex items-center gap-2 transform hover:scale-105 active:scale-95">
                <svg id="playIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <svg id="stopIcon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path></svg>
                <span id="btnText" class="text-lg">បើកដំណើរការចរន្ត</span>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <!-- ========================================== -->
        <!-- SERIES CIRCUIT PANEL -->
        <!-- ========================================== -->
        <section class="bg-slate-800 rounded-2xl p-6 shadow-xl border border-slate-700">
            <h2 class="text-2xl font-bold text-center mb-4 pb-2 border-b border-slate-600">សៀគ្វីតជាស៊េរី <span class="text-sm font-normal text-gray-400">(Series)</span></h2>
            
            <div class="flex justify-center mb-6 bg-slate-900 rounded-xl p-4 overflow-x-auto">
                <svg width="400" height="250" viewBox="0 0 400 250">
                    <defs>
                        <!-- Resistor Symbol -->
                        <g id="resistor">
                            <path d="M 0 0 L 10 0 L 15 -10 L 25 10 L 35 -10 L 45 10 L 55 -10 L 60 0 L 70 0" fill="none" stroke="#ef4444" stroke-width="3" class="glow"/>
                        </g>
                        <!-- Battery Symbol -->
                        <g id="battery">
                            <line x1="0" y1="-25" x2="0" y2="25" stroke="white" stroke-width="4"/>
                            <line x1="10" y1="-15" x2="10" y2="15" stroke="white" stroke-width="2"/>
                            <text x="-15" y="-10" fill="white" font-size="14" font-weight="bold">+</text>
                            <text x="20" y="-10" fill="white" font-size="14" font-weight="bold">-</text>
                            <text x="-5" y="-35" fill="white" font-size="12">12V</text>
                        </g>
                        <!-- Ammeter Symbol -->
                        <g id="ammeter">
                            <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
                            <text x="-5" y="5" fill="#94a3b8" font-size="14" font-weight="bold">A</text>
                        </g>
                        <!-- Arrow Marker -->
                        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
                        </marker>
                    </defs>

                    <!-- Wires with wire-series class -->
                    <path class="wire-series" d="M 200 40 L 50 40 L 50 200 L 100 200" fill="none" stroke="#ef4444" stroke-width="2" marker-start="url(#arrow)" />
                    <path class="wire-series" d="M 170 200 L 180 200" fill="none" stroke="#ef4444" stroke-width="2" />
                    <path class="wire-series" d="M 220 200 L 230 200" fill="none" stroke="#ef4444" stroke-width="2" marker-start="url(#arrow)"/>
                    <path class="wire-series" d="M 300 200 L 350 200 L 350 40 L 210 40" fill="none" stroke="#ef4444" stroke-width="2" marker-start="url(#arrow)" />
                    
                    <!-- Components -->
                    <use href="#battery" x="200" y="40" />
                    
                    <use href="#ammeter" x="50" y="120" />
                    <text x="43" y="125" fill="#38bdf8" font-size="10" font-weight="bold">1</text>
                    <rect x="70" y="110" width="60" height="20" class="value-box"/>
                    <text x="75" y="124" class="value-text" id="s_disp_a1">I = 0.00A</text>

                    <use href="#resistor" x="100" y="200" />
                    <text x="125" y="235" fill="white" font-size="14">R₁</text>

                    <use href="#ammeter" x="200" y="200" />
                    <text x="193" y="205" fill="#38bdf8" font-size="10" font-weight="bold">3</text>
                    <rect x="170" y="160" width="60" height="20" class="value-box"/>
                    <text x="175" y="174" class="value-text" id="s_disp_a3">I = 0.00A</text>

                    <use href="#resistor" x="230" y="200" />
                    <text x="255" y="235" fill="white" font-size="14">R₂</text>

                    <use href="#ammeter" x="350" y="120" />
                    <text x="343" y="125" fill="#38bdf8" font-size="10" font-weight="bold">2</text>
                    <rect x="270" y="110" width="60" height="20" class="value-box"/>
                    <text x="275" y="124" class="value-text" id="s_disp_a2">I = 0.00A</text>
                </svg>
            </div>

            <div class="grid grid-cols-2 gap-6 mb-6">
                <div>
                    <label class="block text-sm mb-1 text-gray-300">តង់ស្យុង (V)</label>
                    <div class="text-xl font-bold text-yellow-400">12 V <span class="text-xs font-normal text-gray-500">(ថេរ)</span></div>
                </div>
                <div>
                    <label class="block text-sm mb-1 text-gray-300">រេស៊ីស្តង់សមមូល (R<sub>eq</sub>)</label>
                    <div class="text-xl font-bold text-emerald-400"><span id="s_req_val">20</span> Ω</div>
                </div>
                
                <div class="col-span-2 space-y-4">
                    <div>
                        <div class="flex justify-between mb-1">
                            <label class="text-sm text-gray-300">តម្លៃរេស៊ីស្តង់ R₁</label>
                            <span class="text-sm font-bold text-sky-300"><span id="s_r1_lbl">10</span> Ω</span>
                        </div>
                        <input type="range" id="s_r1" min="1" max="100" value="10" class="slider">
                    </div>
                    <div>
                        <div class="flex justify-between mb-1">
                            <label class="text-sm text-gray-300">តម្លៃរេស៊ីស្តង់ R₂</label>
                            <span class="text-sm font-bold text-sky-300"><span id="s_r2_lbl">10</span> Ω</span>
                        </div>
                        <input type="range" id="s_r2" min="1" max="100" value="10" class="slider">
                    </div>
                </div>
            </div>
        </section>

        <!-- ========================================== -->
        <!-- PARALLEL CIRCUIT PANEL -->
        <!-- ========================================== -->
        <section class="bg-slate-800 rounded-2xl p-6 shadow-xl border border-slate-700">
            <h2 class="text-2xl font-bold text-center mb-4 pb-2 border-b border-slate-600">សៀគ្វីតជាខ្នែង <span class="text-sm font-normal text-gray-400">(Parallel)</span></h2>
            
            <div class="flex justify-center mb-6 bg-slate-900 rounded-xl p-4 overflow-x-auto">
                <svg width="400" height="250" viewBox="0 0 400 250">
                    <!-- Main Loop Wires -->
                    <path class="wire-parallel-main" d="M 195 40 L 50 40 L 50 145" fill="none" stroke="#ef4444" stroke-width="2" marker-start="url(#arrow)"/>
                    <path class="wire-parallel-main" d="M 50 145 L 50 150 L 100 150" fill="none" stroke="#ef4444" stroke-width="2" />
                    <path class="wire-parallel-main" d="M 300 150 L 350 150 L 350 40 L 215 40" fill="none" stroke="#ef4444" stroke-width="2" marker-start="url(#arrow)"/>
                    
                    <!-- Branch 1 (Top) -->
                    <path class="wire-parallel-b1" d="M 100 150 L 100 100 L 135 100" fill="none" stroke="#ef4444" stroke-width="2" marker-start="url(#arrow)"/>
                    <path class="wire-parallel-b1" d="M 165 100 L 230 100" fill="none" stroke="#ef4444" stroke-width="2"/>
                    <path class="wire-parallel-b1" d="M 300 100 L 300 150" fill="none" stroke="#ef4444" stroke-width="2"/>
                    
                    <!-- Branch 2 (Bottom) -->
                    <path class="wire-parallel-b2" d="M 100 150 L 100 200 L 135 200" fill="none" stroke="#ef4444" stroke-width="2" marker-start="url(#arrow)"/>
                    <path class="wire-parallel-b2" d="M 165 200 L 230 200" fill="none" stroke="#ef4444" stroke-width="2"/>
                    <path class="wire-parallel-b2" d="M 300 200 L 300 150" fill="none" stroke="#ef4444" stroke-width="2"/>
                    
                    <!-- Nodes P and Q -->
                    <circle cx="100" cy="150" r="4" fill="white" />
                    <text x="85" y="165" fill="white" font-size="12">P</text>
                    <circle cx="300" cy="150" r="4" fill="white" />
                    <text x="310" y="165" fill="white" font-size="12">Q</text>

                    <!-- Components -->
                    <use href="#battery" x="205" y="40" />
                    
                    <!-- Main Ammeter -->
                    <use href="#ammeter" x="50" y="100" />
                    <rect x="70" y="90" width="70" height="20" class="value-box"/>
                    <text x="75" y="104" class="value-text" id="p_disp_a">I = 0.00A</text>

                    <!-- Top Branch -->
                    <use href="#ammeter" x="150" y="100" />
                    <text x="143" y="105" fill="#38bdf8" font-size="10" font-weight="bold">1</text>
                    <rect x="120" y="65" width="60" height="20" class="value-box"/>
                    <text x="125" y="79" class="value-text" id="p_disp_a1">I₁= 0.00A</text>

                    <use href="#resistor" x="230" y="100" />
                    <text x="255" y="85" fill="white" font-size="14">R₁</text>

                    <!-- Bottom Branch -->
                    <use href="#ammeter" x="150" y="200" />
                    <text x="143" y="205" fill="#38bdf8" font-size="10" font-weight="bold">2</text>
                    <rect x="120" y="220" width="60" height="20" class="value-box"/>
                    <text x="125" y="234" class="value-text" id="p_disp_a2">I₂= 0.00A</text>

                    <use href="#resistor" x="230" y="200" />
                    <text x="255" y="235" fill="white" font-size="14">R₂</text>
                </svg>
            </div>

            <div class="grid grid-cols-2 gap-6 mb-6">
                <div>
                    <label class="block text-sm mb-1 text-gray-300">តង់ស្យុង (V)</label>
                    <div class="text-xl font-bold text-yellow-400">12 V <span class="text-xs font-normal text-gray-500">(ថេរ)</span></div>
                </div>
                <div>
                    <label class="block text-sm mb-1 text-gray-300">រេស៊ីស្តង់សមមូល (R<sub>eq</sub>)</label>
                    <div class="text-xl font-bold text-emerald-400"><span id="p_req_val">5.00</span> Ω</div>
                </div>
                
                <div class="col-span-2 space-y-4">
                    <div>
                        <div class="flex justify-between mb-1">
                            <label class="text-sm text-gray-300">តម្លៃរេស៊ីស្តង់ R₁</label>
                            <span class="text-sm font-bold text-sky-300"><span id="p_r1_lbl">10</span> Ω</span>
                        </div>
                        <input type="range" id="p_r1" min="1" max="100" value="10" class="slider">
                    </div>
                    <div>
                        <div class="flex justify-between mb-1">
                            <label class="text-sm text-gray-300">តម្លៃរេស៊ីស្តង់ R₂</label>
                            <span class="text-sm font-bold text-sky-300"><span id="p_r2_lbl">10</span> Ω</span>
                        </div>
                        <input type="range" id="p_r2" min="1" max="100" value="10" class="slider">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const V = 12; // Fixed Voltage

        // Series Elements
        const s_r1_input = document.getElementById('s_r1');
        const s_r2_input = document.getElementById('s_r2');
        const s_r1_lbl = document.getElementById('s_r1_lbl');
        const s_r2_lbl = document.getElementById('s_r2_lbl');
        const s_req_val = document.getElementById('s_req_val');
        const s_disp_a1 = document.getElementById('s_disp_a1');
        const s_disp_a2 = document.getElementById('s_disp_a2');
        const s_disp_a3 = document.getElementById('s_disp_a3');

        // Parallel Elements
        const p_r1_input = document.getElementById('p_r1');
        const p_r2_input = document.getElementById('p_r2');
        const p_r1_lbl = document.getElementById('p_r1_lbl');
        const p_r2_lbl = document.getElementById('p_r2_lbl');
        const p_req_val = document.getElementById('p_req_val');
        const p_disp_a = document.getElementById('p_disp_a');
        const p_disp_a1 = document.getElementById('p_disp_a1');
        const p_disp_a2 = document.getElementById('p_disp_a2');
        
        // Button Elements
        const toggleBtn = document.getElementById('toggleBtn');
        const playIcon = document.getElementById('playIcon');
        const stopIcon = document.getElementById('stopIcon');
        const btnText = document.getElementById('btnText');
        let isRunning = false;

        // Function គណនាល្បឿនផ្អែកលើចរន្ត (ចរន្តធំ = លឿន, ចរន្តតូច = យឺត)
        function getSpeedStr(current) {
            if (current === 0) return '999s'; // ឈប់
            let speed = 1 / current;
            if (speed < 0.1) speed = 0.1; // កំណត់លឿនបំផុត
            if (speed > 5) speed = 5;     // កំណត់យឺតបំផុត
            return speed + 's';
        }

        // Calculate Series
        function updateSeries() {
            let r1 = parseFloat(s_r1_input.value);
            let r2 = parseFloat(s_r2_input.value);
            
            s_r1_lbl.innerText = r1;
            s_r2_lbl.innerText = r2;

            let req = r1 + r2;
            s_req_val.innerText = req.toFixed(2);

            let i = V / req;
            let i_str = "I = " + i.toFixed(2) + "A";

            s_disp_a1.textContent = i_str;
            s_disp_a2.textContent = i_str;
            s_disp_a3.textContent = i_str;
            
            // ផ្លាស់ប្តូរល្បឿន
            document.documentElement.style.setProperty('--series-speed', getSpeedStr(i));
        }

        // Calculate Parallel
        function updateParallel() {
            let r1 = parseFloat(p_r1_input.value);
            let r2 = parseFloat(p_r2_input.value);
            
            p_r1_lbl.innerText = r1;
            p_r2_lbl.innerText = r2;

            let req = 1 / ((1/r1) + (1/r2));
            p_req_val.innerText = req.toFixed(2);

            let i1 = V / r1;
            let i2 = V / r2;
            let itotal = i1 + i2;

            p_disp_a.textContent = "I = " + itotal.toFixed(2) + "A";
            p_disp_a1.textContent = "I₁= " + i1.toFixed(2) + "A";
            p_disp_a2.textContent = "I₂= " + i2.toFixed(2) + "A";
            
            // ផ្លាស់ប្តូរល្បឿនដោយផ្អែកលើចរន្តរៀងៗខ្លួន
            document.documentElement.style.setProperty('--parallel-speed-main', getSpeedStr(itotal));
            document.documentElement.style.setProperty('--parallel-speed-b1', getSpeedStr(i1));
            document.documentElement.style.setProperty('--parallel-speed-b2', getSpeedStr(i2));
        }

        // Event Listeners for Sliders
        s_r1_input.addEventListener('input', updateSeries);
        s_r2_input.addEventListener('input', updateSeries);
        p_r1_input.addEventListener('input', updateParallel);
        p_r2_input.addEventListener('input', updateParallel);

        // Event Listener for Toggle Button
        toggleBtn.addEventListener('click', () => {
            isRunning = !isRunning;
            if (isRunning) {
                document.body.classList.add('running');
                btnText.textContent = 'បិទដំណើរការចរន្ត';
                toggleBtn.classList.replace('bg-emerald-500', 'bg-red-500');
                toggleBtn.classList.replace('hover:bg-emerald-600', 'hover:bg-red-600');
                toggleBtn.classList.replace('shadow-[0_0_15px_rgba(16,185,129,0.5)]', 'shadow-[0_0_15px_rgba(239,68,68,0.5)]');
                playIcon.classList.add('hidden');
                stopIcon.classList.remove('hidden');
            } else {
                document.body.classList.remove('running');
                btnText.textContent = 'បើកដំណើរការចរន្ត';
                toggleBtn.classList.replace('bg-red-500', 'bg-emerald-500');
                toggleBtn.classList.replace('hover:bg-red-600', 'hover:bg-emerald-600');
                toggleBtn.classList.replace('shadow-[0_0_15px_rgba(239,68,68,0.5)]', 'shadow-[0_0_15px_rgba(16,185,129,0.5)]');
                playIcon.classList.remove('hidden');
                stopIcon.classList.add('hidden');
            }
        });

        // Initial Call
        updateSeries();
        updateParallel();
    </script>
</body>
</html>
