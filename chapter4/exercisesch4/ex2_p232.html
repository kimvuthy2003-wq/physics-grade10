<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>លំហាត់ទី២៖ ចំណាំងបែរពន្លឺពីខ្យល់ទៅទឹក (ច្បាប់ស្នែល)</title>
    
    <!-- បញ្ចូលបណ្ណាល័យ MathJax សម្រាប់បង្ហាញរូបមន្តគណិតវិទ្យា -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Khmer+OS+Battambang:wght@400;700&display=swap');

        body {
            font-family: 'Khmer OS Battambang', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background-color: #2563eb;
            color: white;
            padding: 16px 24px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .content {
            padding: 24px;
        }

        .problem-statement {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #1f2937;
            margin-bottom: 24px;
            padding: 16px;
            background-color: #f9fafb;
            border-left: 4px solid #3b82f6;
            border-radius: 4px;
        }

        .canvas-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 15px;
            position: relative;
        }

        canvas {
            background-color: #ffffff;
            border: 1.5px solid #94a3b8;
            border-radius: 8px;
            max-width: 100%;
            height: auto;
            margin-bottom: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 650px;
            background-color: #e2e8f0;
            padding: 20px;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .slider-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .slider-row label {
            font-weight: bold;
            font-size: 1.1rem;
            color: #1e3a8a;
            width: 240px;
        }

        input[type="range"] {
            flex-grow: 1;
            cursor: pointer;
        }

        .val-display {
            width: 110px;
            text-align: right;
            font-weight: bold;
            font-size: 1.15rem;
            color: #1d4ed8;
            background-color: white;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }

        button.action-btn {
            font-family: 'Khmer OS Battambang', sans-serif;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: all 0.2s;
        }

        .btn-ray { background-color: #059669; }
        .btn-ray:hover { background-color: #047857; }

        .btn-protractor { background-color: #d97706; }
        .btn-protractor:hover { background-color: #b45309; }

        .btn-reset { background-color: #64748b; }
        .btn-reset:hover { background-color: #475569; }
        
        .btn-solution { background-color: #2563eb; }
        .btn-solution:hover { background-color: #1d4ed8; }

        .solution-box {
            display: block;
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 24px;
            margin-top: 20px;
            color: #1e3a8a;
            line-height: 1.8;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>លំហាត់ទី២៖ ចំណាំងបែរពន្លឺឆ្លងកាត់ពីខ្យល់ទៅទឹក</h1>
    </div>
    
    <div class="content">
        <div class="problem-statement">
            <strong>២. រូបខាងក្រោមបង្ហាញពីកាំពន្លឺចាំងប៉ះលើផ្ទៃញែកដែលមានមុំចំណាំងប៉ះ $60^\circ$ ។ សន្ទស្សន៍ចំណាំងបែរនៃទឹកគឺ $1.33$ ។</strong><br>
            ក. គណនាមុំចំណាំងបែរ ។<br>
            ខ. បំពេញដ្យាក្រាមដោយគូសកាំចាំងបែរនៅក្នុងទឹក ។
        </div>

        <div class="canvas-container">
            <canvas id="simCanvas" width="760" height="420"></canvas>
            
            <div class="controls">
                <div class="slider-row">
                    <label>មុំចំណាំងប៉ះក្នុងខ្យល់ ($\theta_1$) :</label>
                    <input type="range" id="sliderTheta1" min="0" max="85" value="60" step="1" oninput="updateSimulation()">
                    <div class="val-display" id="valTheta1">60°</div>
                </div>
                <div class="slider-row">
                    <label>សន្ទស្សន៍ចំណាំងបែរទឹក ($n_2$) :</label>
                    <input type="range" id="sliderN2" min="1.00" max="2.42" value="1.33" step="0.01" oninput="updateSimulation()">
                    <div class="val-display" id="valN2">1.33</div>
                </div>
                
                <div class="slider-row" style="margin-top: 8px; padding-top: 12px; border-top: 2px dashed #cbd5e1;">
                    <label style="color: #059669;">មុំចំណាំងបែរក្នុងទឹក ($\theta_2$) :</label>
                    <div style="flex-grow: 1;"></div>
                    <div class="val-display" id="valTheta2" style="color: #059669; border-color: #059669; font-size: 1.25rem; width: 130px;">40.63°</div>
                </div>
            </div>

            <div class="btn-group">
                <button class="action-btn btn-ray" id="btnToggleRay" onclick="toggleRefractedRay()">លាក់/បង្ហាញកាំចាំងបែរ (សំណួរ ខ)</button>
                <button class="action-btn btn-protractor" onclick="toggleProtractor()">បង្ហាញ/លាក់រង្វាស់មុំ (Protractor)</button>
                <button class="action-btn btn-reset" onclick="resetToProblem()">កំណត់ដូចប្រធានដើម (60°, n=1.33)</button>
                <button class="action-btn btn-solution" onclick="toggleSolution()">លាក់/បង្ហាញដំណោះស្រាយ</button>
            </div>
        </div>

        <div class="solution-box" id="solutionBox">
            <h2 style="margin-top:0; border-bottom:2px solid #93c5fd; padding-bottom:8px; color: #1d4ed8;">ដំណោះស្រាយលំហាត់ទី២</h2>
            <div id="solutionContent"></div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    const n1 = 1.00; // ខ្យល់
    let theta1Deg = 60;
    let n2 = 1.33;
    let theta2Deg = 40.63;
    let showRefracted = true;
    let showProtractor = true;

    function toggleRefractedRay() {
        showRefracted = !showRefracted;
    }

    function toggleProtractor() {
        showProtractor = !showProtractor;
    }

    function toggleSolution() {
        const box = document.getElementById('solutionBox');
        box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    function resetToProblem() {
        document.getElementById('sliderTheta1').value = 60;
        document.getElementById('sliderN2').value = 1.33;
        showRefracted = true;
        updateSimulation();
    }

    function updateSimulation() {
        theta1Deg = parseFloat(document.getElementById('sliderTheta1').value);
        n2 = parseFloat(document.getElementById('sliderN2').value);

        let theta1Rad = theta1Deg * Math.PI / 180;
        let sinTheta1 = Math.sin(theta1Rad);
        let sinTheta2 = (n1 * sinTheta1) / n2;
        let theta2Rad = Math.asin(Math.min(1, sinTheta2));
        theta2Deg = theta2Rad * 180 / Math.PI;

        document.getElementById('valTheta1').innerText = theta1Deg.toFixed(0) + "°";
        document.getElementById('valN2').innerText = n2.toFixed(2);
        document.getElementById('valTheta2').innerText = theta2Deg.toFixed(2) + "°";

        let mathHTML = `
            <p><strong>បម្រាប់៖</strong></p>
            <ul>
                <li>សន្ទស្សន៍ចំណាំងបែរនៃខ្យល់៖ $n_1 = 1.00$</li>
                <li>សន្ទស្សន៍ចំណាំងបែរនៃទឹក៖ $n_2 = ${n2.toFixed(2)}$</li>
                <li>មុំចំណាំងប៉ះ៖ $\\theta_1 = ${theta1Deg}^\\circ$</li>
            </ul>
            <p><strong>ក. គណនាមុំចំណាំងបែរ ($\\theta_2$) ៖</strong><br>
            តាមច្បាប់ស្នែល-ដេកាត (Snell's Law)៖
            $$ n_1 \\sin\\theta_1 = n_2 \\sin\\theta_2 \\implies \\sin\\theta_2 = \\frac{n_1 \\sin\\theta_1}{n_2} $$
            ជំនួសលេខ៖
            $$ \\sin\\theta_2 = \\frac{1.00 \\times \\sin ${theta1Deg}^\\circ}{${n2.toFixed(2)}} = \\frac{${sinTheta1.toFixed(4)}}{${n2.toFixed(2)}} \\approx ${sinTheta2.toFixed(4)} $$
            $$ \\theta_2 = \\arcsin(${sinTheta2.toFixed(4)}) \\approx \\mathbf{${theta2Deg.toFixed(2)}^\\circ} $$
            </p>
            <p><strong>ខ. សង់កាំពន្លឺចាំងបែរក្នុងទឹក៖</strong><br>
            ដោយសារពន្លឺឆ្លងកាត់ពីមជ្ឈដ្ឋានខ្យល់ ($n_1=1.00$) ចូលទៅក្នុងទឹក ($n_2=${n2.toFixed(2)}$) ដែលមានសន្ទស្សន៍ចំណាំងបែរធំជាង នោះកាំចាំងបែរត្រូវងាកខិតចូលជិតបន្ទាត់កែង ដោយបង្កើតបានមុំ $\\theta_2 = ${theta2Deg.toFixed(2)}^\\circ$ ជាមួយបន្ទាត់កែង។</p>
        `;

        const solContainer = document.getElementById('solutionContent');
        solContainer.innerHTML = mathHTML;

        if (window.MathJax && window.MathJax.typesetPromise) {
            MathJax.typesetPromise([solContainer]);
        }
    }

    function drawArrowOnLine(x1, y1, x2, y2, frac, color) {
        let ax = x1 + (x2 - x1) * frac;
        let ay = y1 + (y2 - y1) * frac;
        let angle = Math.atan2(y2 - y1, x2 - x1);

        ctx.save();
        ctx.translate(ax, ay);
        ctx.rotate(angle);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(11, 0);
        ctx.lineTo(-8, -8);
        ctx.lineTo(-8, 8);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    function drawWaterDashes(boundaryY, width, height) {
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 1.5;
        for (let y = boundaryY + 22; y < height - 12; y += 26) {
            let shift = ((y - boundaryY) % 52 === 0) ? 22 : 0;
            for (let x = 25 + shift; x < width - 30; x += 65) {
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + 25, y);
                ctx.stroke();
            }
        }
    }

    function drawProtractorOverlay(cx, cy, radius) {
        ctx.save();
        ctx.strokeStyle = 'rgba(100, 116, 139, 0.45)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.stroke();

        for (let deg = 0; deg < 360; deg += 10) {
            let rad = (deg - 90) * Math.PI / 180;
            let rIn = (deg % 30 === 0) ? radius - 14 : radius - 7;
            ctx.beginPath();
            ctx.moveTo(cx + rIn * Math.cos(rad), cy + rIn * Math.sin(rad));
            ctx.lineTo(cx + radius * Math.cos(rad), cy + radius * Math.sin(rad));
            ctx.stroke();
        }
        ctx.restore();
    }

    // គូសអក្សរ ឬលេខដោយមានគែមពណ៌ស (Halo) ពីក្រោយដើម្បីឱ្យលេចធ្លោច្បាស់
    function drawClearText(text, x, y, font, fillColor, align = 'center', strokeColor = 'rgba(255,255,255,0.92)') {
        ctx.save();
        ctx.font = font;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 6;
        ctx.strokeStyle = strokeColor;
        ctx.lineJoin = 'round';
        ctx.strokeText(text, x, y);
        ctx.fillStyle = fillColor;
        ctx.fillText(text, x, y);
        ctx.restore();
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const cx = canvas.width / 2 - 20;
        const cy = canvas.height / 2;

        // ១. គូសមជ្ឈដ្ឋានខ្យល់ (ខាងលើ) និងទឹក (ខាងក្រោម)
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, cy);

        ctx.fillStyle = '#e0f2fe';
        ctx.fillRect(0, cy, canvas.width, canvas.height - cy);

        // គូសឆ្នូតៗតំណាងឱ្យទឹក
        drawWaterDashes(cy, canvas.width, canvas.height);

        // ២. បន្ទាត់ផ្ទៃញែក (Boundary) និងបន្ទាត់កែង (Normal Line)
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(25, cy);
        ctx.lineTo(canvas.width - 25, cy);
        ctx.stroke();

        ctx.setLineDash([8, 7]);
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(cx, 15);
        ctx.lineTo(cx, canvas.height - 15);
        ctx.stroke();
        ctx.setLineDash([]);

        if (showProtractor) {
            drawProtractorOverlay(cx, cy, 165);
        }

        // ៣. ស្លាកឈ្មោះមជ្ឈដ្ឋានធំច្បាស់ («ខ្យល់» និង «ទឹក»)
        drawClearText('ខ្យល់', cx + 245, cy - 55, 'bold 30px "Khmer OS Battambang"', '#0f172a', 'center');
        drawClearText('(n₁ = 1.00)', cx + 245, cy - 20, 'bold 20px Arial', '#334155', 'center');

        drawClearText('ទឹក', cx + 245, cy + 45, 'bold 30px "Khmer OS Battambang"', '#0369a1', 'center', 'rgba(224,242,254,0.95)');
        drawClearText(`(n₂ = ${n2.toFixed(2)})`, cx + 245, cy + 82, 'bold 20px Arial', '#0284c7', 'center', 'rgba(224,242,254,0.95)');

        // ៤. គណនាកូអរដោនេកាំពន្លឺ
        let theta1Rad = theta1Deg * Math.PI / 180;
        let theta2Rad = theta2Deg * Math.PI / 180;
        let rayLen = 180;

        let incStartX = cx - rayLen * Math.sin(theta1Rad);
        let incStartY = cy - rayLen * Math.cos(theta1Rad);

        let refEndX = cx + rayLen * Math.sin(theta2Rad);
        let refEndY = cy + rayLen * Math.cos(theta2Rad);

        // ៥. គូសធ្នូ និងលេខមុំចំណាំងប៉ះធំច្បាស់ (theta 1)
        if (theta1Deg > 2) {
            ctx.strokeStyle = '#dc2626';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(cx, cy, 65, -Math.PI / 2 - theta1Rad, -Math.PI / 2);
            ctx.stroke();

            let labelAngle1 = -Math.PI / 2 - theta1Rad / 2;
            let lx1 = cx + 102 * Math.cos(labelAngle1);
            let ly1 = cy + 102 * Math.sin(labelAngle1);
            drawClearText(`${theta1Deg.toFixed(0)}°`, lx1, ly1, 'bold 26px Arial', '#dc2626', 'center');
        }

        // ៦. គូសកាំពន្លឺចាំងប៉ះ (Incident Ray)
        ctx.strokeStyle = '#dc2626';
        ctx.lineWidth = 4.5;
        ctx.beginPath();
        ctx.moveTo(incStartX, incStartY);
        ctx.lineTo(cx, cy);
        ctx.stroke();
        drawArrowOnLine(incStartX, incStartY, cx, cy, 0.52, '#dc2626');

        // ស្លាក «កាំចាំងប៉ះ» ធំច្បាស់
        drawClearText('កាំចាំងប៉ះ', incStartX - 15, incStartY - 12, 'bold 22px "Khmer OS Battambang"', '#b91c1c', 'right');

        // ៧. គូសកាំពន្លឺចាំងបែរនៅក្នុងទឹក (Refracted Ray - សំណួរ ខ)
        if (showRefracted) {
            // បន្ទាត់ដាច់ៗបង្ហាញទិសដៅដើមប្រសិនបើគ្មានចំណាំងបែរ
            let straightX = cx + (rayLen * 0.78) * Math.sin(theta1Rad);
            let straightY = cy + (rayLen * 0.78) * Math.cos(theta1Rad);
            ctx.setLineDash([5, 5]);
            ctx.strokeStyle = 'rgba(220, 38, 38, 0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(straightX, straightY);
            ctx.stroke();
            ctx.setLineDash([]);

            // ធ្នូ និងលេខមុំចំណាំងបែរធំច្បាស់ (theta 2)
            if (theta2Deg > 2) {
                ctx.strokeStyle = '#059669';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(cx, cy, 70, Math.PI / 2 - theta2Rad, Math.PI / 2);
                ctx.stroke();

                let labelAngle2 = Math.PI / 2 - theta2Rad / 2;
                let lx2 = cx + 108 * Math.cos(labelAngle2);
                let ly2 = cy + 108 * Math.sin(labelAngle2);
                drawClearText(`${theta2Deg.toFixed(1)}°`, lx2, ly2, 'bold 26px Arial', '#047857', 'center', 'rgba(224,242,254,0.95)');
            }

            // កាំពន្លឺចាំងបែរ
            ctx.strokeStyle = '#059669';
            ctx.lineWidth = 4.5;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(refEndX, refEndY);
            ctx.stroke();
            drawArrowOnLine(cx, cy, refEndX, refEndY, 0.55, '#059669');

            // ស្លាក «កាំចាំងបែរ» ធំច្បាស់
            drawClearText('កាំចាំងបែរ', refEndX + 15, refEndY + 5, 'bold 22px "Khmer OS Battambang"', '#047857', 'left', 'rgba(224,242,254,0.95)');
        }

        requestAnimationFrame(render);
    }

    updateSimulation();
    render();
</script>
</body>
</html>
