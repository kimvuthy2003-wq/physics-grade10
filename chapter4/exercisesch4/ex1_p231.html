<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>លំហាត់ទី១៖ ល្បឿនពន្លឺក្នុងមជ្ឈដ្ឋានកែវ និងសន្ទស្សន៍ចំណាំងបែរ</title>
    
    <!-- បញ្ចូលបណ្ណាល័យ MathJax សម្រាប់បង្ហាញរូបមន្តគណិតវិទ្យា -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Khmer+OS+Battambang:wght@400;700&display=swap');

        body {
            font-family: 'Khmer OS Battambang', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background-color: #2563eb;
            color: white;
            padding: 16px 24px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .content {
            padding: 24px;
        }

        .problem-statement {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #1f2937;
            margin-bottom: 24px;
            padding: 16px;
            background-color: #f9fafb;
            border-left: 4px solid #3b82f6;
            border-radius: 4px;
        }

        .canvas-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #0f172a;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 20px;
            position: relative;
        }

        canvas {
            background-color: #0f172a;
            border-radius: 6px;
            max-width: 100%;
            height: auto;
            margin-bottom: 20px;
        }

        .preset-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            justify-content: center;
        }

        .preset-btn {
            font-family: 'Khmer OS Battambang', sans-serif;
            background-color: #1e293b;
            color: #e2e8f0;
            border: 1px solid #475569;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .preset-btn:hover, .preset-btn.active {
            background-color: #3b82f6;
            color: white;
            border-color: #60a5fa;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 650px;
            background-color: #e2e8f0;
            padding: 20px;
            border-radius: 8px;
        }

        .slider-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .slider-row label {
            font-weight: bold;
            font-size: 1.05rem;
            color: #1e3a8a;
            width: 240px;
        }

        input[type="range"] {
            flex-grow: 1;
            cursor: pointer;
        }

        .val-display {
            width: 130px;
            text-align: right;
            font-weight: bold;
            font-size: 1.05rem;
            color: #1d4ed8;
            background-color: white;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        button.action-btn {
            font-family: 'Khmer OS Battambang', sans-serif;
            padding: 10px 22px;
            border: none;
            border-radius: 6px;
            font-size: 1.05rem;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: all 0.2s;
        }

        .btn-reset { background-color: #64748b; }
        .btn-reset:hover { background-color: #475569; }
        
        .btn-solution { background-color: #2563eb; }
        .btn-solution:hover { background-color: #1d4ed8; }

        .solution-box {
            display: block;
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 24px;
            margin-top: 20px;
            color: #1e3a8a;
            line-height: 1.8;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>លំហាត់ទី១៖ ល្បឿនពន្លឺក្នុងមជ្ឈដ្ឋានកែវ និងសន្ទស្សន៍ចំណាំងបែរ</h1>
    </div>
    
    <div class="content">
        <div class="problem-statement">
            <strong>១. គេឱ្យល្បឿនពន្លឺក្នុងសុញ្ញាកាសគឺ $3.0 \times 10^8\text{ m/s}$ ។ គណនាល្បឿនពន្លឺក្នុងកែវដែលមានសន្ទស្សន៍ចំណាំងបែរ $1.52$ ។</strong>
        </div>

        <div class="canvas-container">
            <canvas id="simCanvas" width="800" height="360"></canvas>

            <div class="preset-group">
                <button class="preset-btn" onclick="setMedium(1.00, 'សុញ្ញាកាស')">សុញ្ញាកាស (n = 1.00)</button>
                <button class="preset-btn" onclick="setMedium(1.33, 'ទឹក')">ទឹក (n = 1.33)</button>
                <button class="preset-btn active" id="defaultPreset" onclick="setMedium(1.52, 'កែវ')">កែវក្នុងលំហាត់ (n = 1.52)</button>
                <button class="preset-btn" onclick="setMedium(2.42, 'ពេជ្រ')">ពេជ្រ (n = 2.42)</button>
            </div>
            
            <div class="controls">
                <div class="slider-row">
                    <label>សន្ទស្សន៍ចំណាំងបែរ ($n$) :</label>
                    <input type="range" id="sliderN" min="1.00" max="2.50" value="1.52" step="0.01" oninput="updateSimulation()">
                    <div class="val-display" id="valN">1.52</div>
                </div>
                <div class="slider-row">
                    <label>មុំចាំងប៉ះ ($\theta_1$) :</label>
                    <input type="range" id="sliderAngle" min="0" max="75" value="40" step="1" oninput="updateSimulation()">
                    <div class="val-display" id="valAngle">40°</div>
                </div>
                
                <div class="slider-row" style="margin-top: 8px; padding-top: 12px; border-top: 2px dashed #cbd5e1;">
                    <label style="color: #059669;">ល្បឿនពន្លឺក្នុងមជ្ឈដ្ឋាន ($v$) :</label>
                    <div style="flex-grow: 1;"></div>
                    <div class="val-display" id="valV" style="color: #059669; border-color: #059669; font-size: 1.15rem; width: 170px;">1.97 × 10⁸ m/s</div>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button class="action-btn btn-reset" onclick="resetToProblem()">កំណត់ដូចប្រធានដើម (n = 1.52)</button>
            <button class="action-btn btn-solution" onclick="toggleSolution()">លាក់/បង្ហាញដំណោះស្រាយ</button>
        </div>

        <div class="solution-box" id="solutionBox">
            <h2 style="margin-top:0; border-bottom:2px solid #93c5fd; padding-bottom:8px; color: #1d4ed8;">ដំណោះស្រាយលំហាត់ទី១</h2>
            <div id="solutionContent"></div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    const C_SPEED = 3.0; // គិតជា 10^8 m/s
    let n = 1.52;
    let v = C_SPEED / n;
    let angle1Deg = 40;
    let mediumName = "កែវ";
    let phase = 0;

    function setMedium(valN, name) {
        document.getElementById('sliderN').value = valN;
        mediumName = name;
        document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        updateSimulation();
    }

    function resetToProblem() {
        document.getElementById('sliderN').value = 1.52;
        document.getElementById('sliderAngle').value = 40;
        mediumName = "កែវ";
        document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('defaultPreset').classList.add('active');
        updateSimulation();
    }

    function toggleSolution() {
        const box = document.getElementById('solutionBox');
        box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    function updateSimulation() {
        n = parseFloat(document.getElementById('sliderN').value);
        angle1Deg = parseFloat(document.getElementById('sliderAngle').value);
        v = C_SPEED / n;

        document.getElementById('valN').innerText = n.toFixed(2);
        document.getElementById('valAngle').innerText = angle1Deg + "°";
        document.getElementById('valV').innerText = v.toFixed(2) + " × 10⁸ m/s";

        let mathHTML = `
            <p><strong>បម្រាប់៖</strong></p>
            <ul>
                <li>ល្បឿនពន្លឺក្នុងសុញ្ញាកាស៖ $c = 3.0 \\times 10^8\\text{ m/s}$</li>
                <li>សន្ទស្សន៍ចំណាំងបែរនៃមជ្ឈដ្ឋាន៖ $n = ${n.toFixed(2)}$</li>
            </ul>
            <p><strong>គណនាល្បឿនពន្លឺក្នុងមជ្ឈដ្ឋាន ($v$) ៖</strong><br>
            តាមរូបមន្តសន្ទស្សន៍ចំណាំងបែរ៖
            $$ n = \\frac{c}{v} \\implies v = \\frac{c}{n} $$
            ជំនួសលេខ៖
            $$ v = \\frac{3.0 \\times 10^8\\text{ m/s}}{${n.toFixed(2)}} \\approx \\mathbf{${v.toFixed(2)} \\times 10^8\\text{ m/s}} $$
            </p>
        `;

        const solContainer = document.getElementById('solutionContent');
        solContainer.innerHTML = mathHTML;

        if (window.MathJax && window.MathJax.typesetPromise) {
            MathJax.typesetPromise([solContainer]);
        }
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        phase += 2.5;

        const midX = 280;
        const boundaryY = 180;

        // ១. គូសមជ្ឈដ្ឋានខាងលើ (សុញ្ញាកាស) និងខាងក្រោម (កែវ)
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, 540, boundaryY);

        let glassAlpha = Math.min(0.65, 0.15 + (n - 1) * 0.3);
        ctx.fillStyle = `rgba(56, 189, 248, ${glassAlpha})`;
        ctx.fillRect(0, boundaryY, 540, canvas.height - boundaryY);

        // បន្ទាត់ញែកមជ្ឈដ្ឋាន និងបន្ទាត់កែង (Normal Line)
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, boundaryY);
        ctx.lineTo(540, boundaryY);
        ctx.stroke();

        ctx.setLineDash([6, 6]);
        ctx.strokeStyle = '#64748b';
        ctx.beginPath();
        ctx.moveTo(midX, 20);
        ctx.lineTo(midX, 340);
        ctx.stroke();
        ctx.setLineDash([]);

        // ស្លាកមជ្ឈដ្ឋាន
        ctx.fillStyle = '#e2e8f0';
        ctx.font = 'bold 15px Khmer OS Battambang';
        ctx.fillText('សុញ្ញាកាស (n₁ = 1.00)', 20, 35);
        ctx.fillStyle = '#fde047';
        ctx.font = '14px Arial';
        ctx.fillText('c = 3.00 × 10⁸ m/s', 20, 58);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 15px Khmer OS Battambang';
        ctx.fillText(`មជ្ឈដ្ឋានកែវ (n₂ = ${n.toFixed(2)})`, 20, boundaryY + 35);
        ctx.fillStyle = '#4ade80';
        ctx.font = 'bold 14px Arial';
        ctx.fillText(`v = ${v.toFixed(2)} × 10⁸ m/s`, 20, boundaryY + 58);

        // ២. គណនាមុំចំណាំងបែរ (Snell's Law)
        let theta1 = angle1Deg * Math.PI / 180;
        let sinTheta2 = Math.sin(theta1) / n;
        let theta2 = Math.asin(Math.min(1, sinTheta2));

        let rayLen = 150;
        let startX = midX - rayLen * Math.sin(theta1);
        let startY = boundaryY - rayLen * Math.cos(theta1);
        let endX = midX + rayLen * Math.sin(theta2);
        let endY = boundaryY + rayLen * Math.cos(theta2);

        // គូសកាំពន្លឺចាំងប៉ះ (Incident Ray)
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(midX, boundaryY);
        ctx.stroke();

        // គូសកាំពន្លឺចំណាំងបែរ (Refracted Ray)
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(midX, boundaryY);
        ctx.lineTo(endX, endY);
        ctx.stroke();

        // ៣. គូសគ្រាប់ពន្លឺរត់តាមល្បឿនជាក់ស្តែង (Photons Speed Animation)
        let spacingVacuum = 30;
        let spacingMedium = spacingVacuum / n;

        // គ្រាប់ពន្លឺក្នុងសុញ្ញាកាស
        ctx.fillStyle = '#fef08a';
        for (let d = (phase % spacingVacuum); d < rayLen; d += spacingVacuum) {
            let px = startX + d * Math.sin(theta1);
            let py = startY + d * Math.cos(theta1);
            ctx.beginPath();
            ctx.arc(px, py, 5, 0, Math.PI * 2);
            ctx.fill();
        }

        // គ្រាប់ពន្លឺក្នុងកែវ (ល្បឿនថយចុះតាម v = c/n)
        ctx.fillStyle = '#4ade80';
        let mediumPhase = (phase / n) % spacingMedium;
        for (let d = mediumPhase; d < rayLen; d += spacingMedium) {
            let px = midX + d * Math.sin(theta2);
            let py = boundaryY + d * Math.cos(theta2);
            ctx.beginPath();
            ctx.arc(px, py, 5, 0, Math.PI * 2);
            ctx.fill();
        }

        // ៤. ប្រអប់ប្រៀបធៀបល្បឿនពន្លឺនៅផ្នែកខាងស្តាំ
        let boxX = 555, boxY = 30, boxW = 225, boxH = 300;
        ctx.fillStyle = '#1e293b';
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 1.5;
        ctx.fillRect(boxX, boxY, boxW, boxH);
        ctx.strokeRect(boxX, boxY, boxW, boxH);

        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 14px Khmer OS Battambang';
        ctx.fillText('ប្រៀបធៀបល្បឿនដំណាល', boxX + 25, boxY + 30);

        // របារល្បឿន c
        ctx.fillStyle = '#cbd5e1';
        ctx.font = '13px Khmer OS Battambang';
        ctx.fillText('ក្នុងសុញ្ញាកាស (c)៖ 100%', boxX + 15, boxY + 75);
        ctx.fillStyle = '#334155';
        ctx.fillRect(boxX + 15, boxY + 85, 195, 22);
        ctx.fillStyle = '#facc15';
        ctx.fillRect(boxX + 15, boxY + 85, 195, 22);

        // របារល្បឿន v
        let speedPercent = (1 / n) * 100;
        ctx.fillStyle = '#cbd5e1';
        ctx.fillText(`ក្នុងមជ្ឈដ្ឋាន (v)៖ ${speedPercent.toFixed(1)}%`, boxX + 15, boxY + 145);
        ctx.fillStyle = '#334155';
        ctx.fillRect(boxX + 15, boxY + 155, 195, 22);
        ctx.fillStyle = '#4ade80';
        ctx.fillRect(boxX + 15, boxY + 155, 195 * (1 / n), 22);

        // បង្ហាញរូបមន្តសង្ខេបលើ Canvas
        ctx.fillStyle = '#93c5fd';
        ctx.font = 'bold 15px Arial';
        ctx.fillText(`v = c / n`, boxX + 15, boxY + 220);
        ctx.fillStyle = '#ffffff';
        ctx.font = '14px Arial';
        ctx.fillText(`v = 3.0×10⁸ / ${n.toFixed(2)}`, boxX + 15, boxY + 248);
        ctx.fillStyle = '#4ade80';
        ctx.font = 'bold 16px Arial';
        ctx.fillText(`v = ${v.toFixed(2)} × 10⁸ m/s`, boxX + 15, boxY + 278);

        requestAnimationFrame(render);
    }

    updateSimulation();
    render();
</script>
</body>
</html>
