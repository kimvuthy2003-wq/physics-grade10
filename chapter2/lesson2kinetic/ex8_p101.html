<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ការកំណត់ម៉ាសមាឌទឹក</title>
    <style>
        body {
            font-family: 'Khmer OS Siemreap', 'Kantumruy Pro', sans-serif;
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .simulator-box {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            padding: 30px;
            width: 550px;
            text-align: center;
        }
        h2 {
            color: #2c3e50;
            margin-top: 0;
        }
        .instruction {
            background-color: #eaf2f8;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .beaker-container {
            margin: 20px auto;
            position: relative;
            width: 120px;
            height: 160px;
        }
        .beaker {
            width: 100px;
            height: 150px;
            border: 4px solid #7f8c8d;
            border-top: none;
            border-radius: 0 0 10px 10px;
            margin: 0 auto;
            position: relative;
            background-color: rgba(255, 255, 255, 0.8);
            overflow: hidden;
            z-index: 2;
        }
        .water {
            width: 100%;
            height: 0%;
            background-color: rgba(52, 152, 219, 0.7);
            position: absolute;
            bottom: 0;
            transition: height 0.8s ease-in-out;
        }
        .scale-plate {
            width: 160px;
            height: 10px;
            background-color: #95a5a6;
            margin: 0 auto;
            border-radius: 5px;
        }
        .scale-display {
            background-color: #2ecc71;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 24px;
            font-weight: bold;
            padding: 10px;
            width: 140px;
            margin: -5px auto 20px auto;
            border-radius: 0 0 8px 8px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }
        .controls {
            margin-top: 20px;
        }
        input[type="range"] {
            width: 80%;
            margin: 15px 0;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
            margin: 5px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .btn-reset {
            background-color: #e74c3c;
        }
        .btn-reset:hover {
            background-color: #c0392b;
        }
        .btn-solution {
            background-color: #9b59b6;
        }
        .btn-solution:hover {
            background-color: #8e44ad;
        }
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        .solution-box {
            display: none; /* Hidden by default */
            margin-top: 25px;
            background-color: #fdfefe;
            border: 2px dashed #9b59b6;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            font-size: 15px;
            animation: fadeIn 0.5s;
        }
        .solution-box h4 {
            color: #8e44ad;
            margin-top: 0;
            text-align: center;
            border-bottom: 1px solid #d2b4de;
            padding-bottom: 10px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="simulator-box">
        <h2>🔬 ពិសោធន៍កំណត់ម៉ាសមាឌទឹក</h2>
        
        <div class="instruction">
            <strong>របៀបអនុវត្តសម្រាប់សិស្ស៖</strong><br>
            ១. អូសរបារដើម្បីជ្រើសរើសមាឌទឹក (V) ដែលចង់វាស់។<br>
            ២. ចុចប៊ូតុង "ចាក់ទឹកចូល" រួចកត់ត្រាម៉ាសសរុប។<br>
            ៣. ចុចប៊ូតុង "បង្ហាញដំណោះស្រាយ" ដើម្បីផ្ទៀងផ្ទាត់ការគណនារបស់អ្នក។
        </div>

        <div class="beaker-container">
            <div class="beaker">
                <div class="water" id="water-level"></div>
            </div>
            <div class="scale-plate"></div>
        </div>
        
        <div class="scale-display" id="scale-value">50.0 g</div>

        <div class="controls">
            <label for="volume-slider">ជ្រើសរើសមាឌទឹក (V): <b id="volume-text">0</b> mL</label><br>
            <input type="range" id="volume-slider" min="0" max="100" step="10" value="0" oninput="updateVolumeText()">
            <br>
            <button onclick="performExperiment()">💧 ចាក់ទឹកចូល</button>
            <button id="btn-sol" class="btn-solution" onclick="toggleSolution()" disabled>📝 បង្ហាញដំណោះស្រាយ</button>
            <button class="btn-reset" onclick="resetExperiment()">🔄 កំណត់ឡើងវិញ</button>
        </div>

        <!-- Solution Container -->
        <div id="solution-box" class="solution-box">
            <!-- Dynamic content will be injected here -->
        </div>
    </div>

    <script>
        const emptyBeakerMass = 50.0; 
        const waterDensity = 1.0;     
        const maxVolume = 100;        

        function updateVolumeText() {
            let vol = document.getElementById("volume-slider").value;
            document.getElementById("volume-text").innerText = vol;
            
            // Hide solution if user changes volume before clicking pour again
            document.getElementById("solution-box").style.display = "none";
            document.getElementById("btn-sol").disabled = true;
        }

        function performExperiment() {
            let volume = parseFloat(document.getElementById("volume-slider").value);
            let waterMass = volume * waterDensity;
            let totalMass = emptyBeakerMass + waterMass;

            document.getElementById("scale-value").innerText = totalMass.toFixed(1) + " g";
            
            let waterHeightPercentage = (volume / maxVolume) * 100;
            document.getElementById("water-level").style.height = waterHeightPercentage + "%";

            // Enable solution button after pouring
            document.getElementById("btn-sol").disabled = false;
            
            // Update solution content if it is already open
            if(document.getElementById("solution-box").style.display === "block"){
                generateSolutionHTML(volume, totalMass, waterMass);
            }
        }

        function toggleSolution() {
            let box = document.getElementById("solution-box");
            if (box.style.display === "none" || box.style.display === "") {
                let volume = parseFloat(document.getElementById("volume-slider").value);
                let waterMass = volume * waterDensity;
                let totalMass = emptyBeakerMass + waterMass;
                
                generateSolutionHTML(volume, totalMass, waterMass);
                box.style.display = "block";
            } else {
                box.style.display = "none";
            }
        }

        function generateSolutionHTML(volume, totalMass, waterMass) {
            let box = document.getElementById("solution-box");
            
            if (volume === 0) {
                box.innerHTML = `<h4 style="color: #e74c3c;">មិនមានទឹកក្នុងកែវទេ!</h4>
                                 <p style="text-align:center;">សូមជ្រើសរើសមាឌទឹកធំជាង ០ ដើម្បីធ្វើការគណនា។</p>`;
                return;
            }

            let densityCalc = (waterMass / volume).toFixed(1);

            box.innerHTML = `
                <h4>📝 ដំណោះស្រាយ</h4>
                <ul>
                    <li>ម៉ាសកែវវាស់ទទេ <b>(m₁) = ${emptyBeakerMass.toFixed(1)} g</b></li>
                    <li>ម៉ាសកែវ + ទឹក <b>(m₂) = ${totalMass.toFixed(1)} g</b> <i>(អានពីជញ្ជីង)</i></li>
                    <li>មាឌទឹក <b>(V) = ${volume} mL = ${volume} cm³</b></li>
                </ul>
                <p><b>១. គណនាម៉ាសទឹកសុទ្ធ (m)៖</b></p>
                <p style="padding-left:20px; background:#f4f6f7; border-left:3px solid #3498db;">
                    រូបមន្ត៖ m = m₂ - m₁<br>
                    m = ${totalMass.toFixed(1)} - ${emptyBeakerMass.toFixed(1)} = <b>${waterMass.toFixed(1)} g</b>
                </p>
                <p><b>២. គណនាម៉ាសមាឌទឹក (ρ)៖</b></p>
                <p style="padding-left:20px; background:#f4f6f7; border-left:3px solid #2ecc71;">
                    រូបមន្ត៖ ρ = m / V<br>
                    ρ = ${waterMass.toFixed(1)} / ${volume} = <b>${densityCalc} g/cm³</b>
                </p>
                <p style="text-align:center; color:#27ae60;"><b>ដូចនេះ ម៉ាសមាឌទឹកគឺ ${densityCalc} g/cm³ ឬ ${densityCalc * 1000} kg/m³។</b></p>
            `;
        }

        function resetExperiment() {
            document.getElementById("volume-slider").value = 0;
            document.getElementById("volume-text").innerText = "0";
            document.getElementById("water-level").style.height = "0%";
            document.getElementById("scale-value").innerText = emptyBeakerMass.toFixed(1) + " g";
            document.getElementById("solution-box").style.display = "none";
            document.getElementById("btn-sol").disabled = true;
        }
    </script>
</body>

    </script>
</body>
</html>
