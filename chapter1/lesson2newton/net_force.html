<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>កម្មវិធីសិក្សាកម្លាំងផ្គួប (Resultant Force Simulator)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kantumruy Pro', sans-serif;
            background-color: #0f172a;
            margin: 0;
            overflow: hidden;
            touch-action: none; 
            overscroll-behavior: none;
        }
        
        #canvas-container {
            position: absolute;
            inset: 0;
            z-index: 0;
            background-image: 
                radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease-in-out;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .pulse-text {
            animation: pulse-color 2s infinite;
        }

        @keyframes pulse-color {
            0%, 100% { color: #16a34a; text-shadow: 0 0 10px rgba(34, 197, 94, 0.5); }
            50% { color: #22c55e; text-shadow: 0 0 20px rgba(34, 197, 94, 0.8); }
        }
    </style>
</head>
<body class="text-slate-800">

    <div id="canvas-container">
        <canvas id="simCanvas" class="w-full h-full block cursor-crosshair touch-none"></canvas>
    </div>

    <div id="controlPanel" class="glass-panel absolute bottom-0 left-0 w-full md:w-[22rem] md:top-6 md:left-6 md:bottom-auto rounded-t-3xl md:rounded-2xl z-10 flex flex-col max-h-[90vh]">
        
        <!-- Header / Toggle Button -->
        <div id="togglePanelBtn" class="p-5 border-b border-slate-200 flex justify-between items-center bg-slate-50 md:rounded-t-2xl rounded-t-3xl cursor-pointer hover:bg-slate-100 transition-colors">
            <h1 class="text-lg font-bold text-slate-800">កម្លាំងផ្គួប <br><span class="text-sm font-normal text-slate-500">Resultant Force</span></h1>
            <div class="flex items-center gap-2">
                <div class="text-[10px] sm:text-xs bg-slate-200 text-slate-700 px-2 py-1 rounded-full font-semibold border border-slate-300">
                    ១ ក្រឡា = 1 N
                </div>
                <button class="p-1.5 bg-slate-200 text-slate-600 rounded-full hover:bg-slate-300 transition-colors">
                    <svg id="chevronIcon" class="w-5 h-5 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
            </div>
        </div>

        <!-- Main Content (Scrollable & Hideable) -->
        <div id="panelContent" class="p-5 overflow-y-auto no-scrollbar flex flex-col gap-5 transition-all duration-300">
            
            <!-- Magnitudes -->
            <div class="space-y-3">
                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider">តម្លៃកម្លាំងនីមួយៗ (Vectors)</h2>
                
                <!-- F1 -->
                <div class="flex items-center justify-between bg-red-50/50 p-3.5 rounded-xl border border-red-100 hover:border-red-300 transition-all group">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-red-100 flex items-center justify-center text-red-600 font-bold group-hover:scale-110 transition-transform">F₁</div>
                        <div class="text-sm font-semibold text-red-700">កម្លាំងទី១</div>
                    </div>
                    <span id="mag-f1" class="font-bold text-xl text-red-600">0.0 N</span>
                </div>

                <!-- F2 -->
                <div class="flex items-center justify-between bg-blue-50/50 p-3.5 rounded-xl border border-blue-100 hover:border-blue-300 transition-all group">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-blue-100 flex items-center justify-center text-blue-600 font-bold group-hover:scale-110 transition-transform">F₂</div>
                        <div class="text-sm font-semibold text-blue-700">កម្លាំងទី២</div>
                    </div>
                    <span id="mag-f2" class="font-bold text-xl text-blue-600">0.0 N</span>
                </div>
            </div>

            <!-- Resultant Force -->
            <div class="space-y-3 mt-2">
                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider">លទ្ធផល (Result)</h2>
                <div class="bg-gradient-to-br from-green-50 to-emerald-100 p-4 rounded-xl border border-green-200 shadow-[0_4px_20px_rgba(34,197,94,0.15)] relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-green-400 opacity-10 rounded-full blur-2xl -mr-10 -mt-10"></div>
                    
                    <div class="flex justify-between items-center mb-3 relative z-10">
                        <div class="flex items-center gap-2">
                            <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            <span class="font-bold text-green-800">កម្លាំងផ្គួបសរុប (F)</span>
                        </div>
                        <span id="mag-f" class="font-bold text-2xl pulse-text">0.0 N</span>
                    </div>

                    <div class="bg-white/60 p-2.5 rounded-lg text-xs text-green-800 font-mono border border-green-200/50 flex justify-between relative z-10">
                        <span>មុំផ្គុំ (Angle):</span>
                        <span id="angle-val" class="font-bold">0°</span>
                    </div>
                </div>
            </div>

            <!-- Play Animation Button -->
            <div class="mt-2 flex gap-2">
                <button id="playBtn" class="flex-1 flex justify-center items-center gap-2 bg-green-500 hover:bg-green-600 text-white p-3 rounded-xl font-bold shadow-lg shadow-green-500/30 transition-all active:scale-95">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4l12 6-12 6z"></path></svg> Play ដំណើរការ
                </button>
                <button id="resetPlayBtn" class="hidden flex-1 flex justify-center items-center gap-2 bg-slate-500 hover:bg-slate-600 text-white p-3 rounded-xl font-bold shadow-lg shadow-slate-500/30 transition-all active:scale-95">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> ត្រឡប់ដើម
                </button>
            </div>

            <!-- Presets -->
            <div class="space-y-3 mt-2 pb-2">
                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider">ករណីសិក្សា (Presets)</h2>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="setPreset('same')" class="flex flex-col items-center gap-1 p-2 bg-slate-50 hover:bg-slate-100 active:bg-slate-200 rounded-lg border border-slate-200 transition-all text-xs font-semibold text-slate-600">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        ស្របគ្នា
                    </button>
                    <button onclick="setPreset('opposite')" class="flex flex-col items-center gap-1 p-2 bg-slate-50 hover:bg-slate-100 active:bg-slate-200 rounded-lg border border-slate-200 transition-all text-xs font-semibold text-slate-600">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                        ផ្ទុយគ្នា
                    </button>
                    <button onclick="setPreset('perpendicular')" class="flex flex-col items-center gap-1 p-2 bg-slate-50 hover:bg-slate-100 active:bg-slate-200 rounded-lg border border-slate-200 transition-all text-xs font-semibold text-slate-600">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21v-8a2 2 0 012-2h14m0 0l-4-4m4 4l-4 4"></path></svg>
                        កែងគ្នា
                    </button>
                </div>
            </div>
            
            <p class="text-[11px] text-slate-400 text-center leading-relaxed">
                អូសទាញក្បាលព្រួញ <span class="text-red-500 font-bold">ក្រហម</span> ឬ <span class="text-blue-500 font-bold">ខៀវ</span> នៅលើផ្ទៃខាងស្តាំដើម្បីផ្លាស់ប្តូរទំហំ និងទិសដៅនៃកម្លាំង។
            </p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); 
        const container = document.getElementById('canvas-container');

        // UI Elements
        const elMagF1 = document.getElementById('mag-f1');
        const elMagF2 = document.getElementById('mag-f2');
        const elMagF = document.getElementById('mag-f');
        const elAngle = document.getElementById('angle-val');
        const panelContent = document.getElementById('panelContent');
        const chevronIcon = document.getElementById('chevronIcon');
        
        // Play Animation Elements
        const playBtn = document.getElementById('playBtn');
        const resetPlayBtn = document.getElementById('resetPlayBtn');

        // Simulation parameters
        const PIXELS_PER_NEWTON = 60; 
        const HITBOX_RADIUS = 35; 

        let originX, originY;
        let animationTime = 0;
        
        // Force vectors
        let f1 = { dx: 0, dy: 0, color: '#ef4444' };
        let f2 = { dx: 0, dy: 0, color: '#3b82f6' };
        let fResult = { dx: 0, dy: 0, color: '#22c55e' }; 

        // Play Animation State
        let isPlaying = false;
        let cubePos = { x: 0, y: 0 }; 

        // Interaction state
        let draggingElement = null; 
        let isPanelHidden = false;

        // Toggle Panel Logic
        document.getElementById('togglePanelBtn').addEventListener('click', () => {
            isPanelHidden = !isPanelHidden;
            if (isPanelHidden) {
                panelContent.style.display = 'none';
                chevronIcon.style.transform = 'rotate(180deg)';
            } else {
                panelContent.style.display = 'flex';
                chevronIcon.style.transform = 'rotate(0deg)';
            }
        });

        // Play Button Logic
        playBtn.addEventListener('click', () => {
            if (!isPlaying && (fResult.dx !== 0 || fResult.dy !== 0)) {
                isPlaying = true;
                playBtn.classList.add('hidden');
                resetPlayBtn.classList.remove('hidden');
                
                // Hide panel automatically on mobile when playing to see clearly
                if(window.innerWidth <= 768 && !isPanelHidden) {
                    document.getElementById('togglePanelBtn').click();
                }
            }
        });

        resetPlayBtn.addEventListener('click', resetAnimation);

        function resetAnimation() {
            isPlaying = false;
            cubePos = { x: 0, y: 0 };
            resetPlayBtn.classList.add('hidden');
            playBtn.classList.remove('hidden');
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            if (window.innerWidth > 768) {
                originX = canvas.width / 2 + 150; 
                originY = canvas.height / 2;
            } else {
                originX = canvas.width / 2;
                originY = canvas.height / 2 - 50; 
            }
        }

        window.addEventListener('resize', resize);

        function calculateResultant() {
            fResult.dx = f1.dx + f2.dx;
            fResult.dy = f1.dy + f2.dy;
        }

        function getMagnitudeN(vector) {
            return Math.hypot(vector.dx, vector.dy) / PIXELS_PER_NEWTON;
        }

        function getAngleBetween() {
            const angle1 = Math.atan2(f1.dy, f1.dx);
            const angle2 = Math.atan2(f2.dy, f2.dx);
            let diff = Math.abs((angle1 - angle2) * (180 / Math.PI));
            if (diff > 180) diff = 360 - diff;
            return diff;
        }

        function updateUI() {
            const m1 = getMagnitudeN(f1).toFixed(1);
            const m2 = getMagnitudeN(f2).toFixed(1);
            const mr = getMagnitudeN(fResult).toFixed(1);
            const angle = Math.round(getAngleBetween());

            elMagF1.innerText = `${m1} N`;
            elMagF2.innerText = `${m2} N`;
            elMagF.innerText = `${mr} N`;
            elAngle.innerText = `${angle}°`;
        }

        function drawGrid() {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#1e293b'; 
            ctx.lineWidth = 1;
            
            const gridSize = PIXELS_PER_NEWTON;
            
            ctx.beginPath();
            for (let x = originX % gridSize; x < canvas.width; x += gridSize) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
            }
            for (let y = originY % gridSize; y < canvas.height; y += gridSize) {
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
            }
            ctx.stroke();

            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(originX, 0);
            ctx.lineTo(originX, canvas.height);
            ctx.moveTo(0, originY);
            ctx.lineTo(canvas.width, originY);
            ctx.stroke();
        }

        function draw3DCube(x, y, size) {
            const hx = size / 2; 
            const hy = size / 2; 
            const dx = size / 3; 
            const dy = size / 3; 

            ctx.lineWidth = 2;
            ctx.strokeStyle = '#020617';
            ctx.lineJoin = 'round';

            // Top face
            ctx.fillStyle = '#64748b';
            ctx.beginPath();
            ctx.moveTo(x - hx, y - hy);
            ctx.lineTo(x + hx, y - hy);
            ctx.lineTo(x + hx + dx, y - hy - dy);
            ctx.lineTo(x - hx + dx, y - hy - dy);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Right face
            ctx.fillStyle = '#334155';
            ctx.beginPath();
            ctx.moveTo(x + hx, y - hy);
            ctx.lineTo(x + hx + dx, y - hy - dy);
            ctx.lineTo(x + hx + dx, y + hy - dy);
            ctx.lineTo(x + hx, y + hy);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Front face
            ctx.fillStyle = '#475569';
            ctx.beginPath();
            ctx.rect(x - hx, y - hy, size, size);
            ctx.fill();
            ctx.stroke();
            
            // Central dot
            ctx.fillStyle = '#f8fafc';
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(x, y, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0; 
        }

        function drawVector(startX, startY, endX, endY, color, label, isDashed = false, isInteractive = false, isResultant = false) {
            const angle = Math.atan2(endY - startY, endX - startX);
            const length = Math.hypot(endX - startX, endY - startY);
            
            if (length < 1) return;

            ctx.save();

            if (isResultant) {
                ctx.shadowColor = color;
                ctx.shadowBlur = 15 + 10 * Math.sin(animationTime * 5);
                ctx.lineWidth = 5;
            } else {
                ctx.shadowBlur = 0;
                ctx.lineWidth = isDashed ? 2 : 4;
            }

            ctx.beginPath();
            if (isDashed) {
                ctx.setLineDash([10, 10]);
                ctx.strokeStyle = '#475569'; 
            } else {
                ctx.setLineDash([]);
                ctx.strokeStyle = color;
            }
            ctx.lineCap = 'round';
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);
            ctx.stroke();

            if (!isDashed) {
                const arrowSize = isResultant ? 20 : 16;
                ctx.beginPath();
                ctx.moveTo(endX, endY);
                ctx.lineTo(endX - arrowSize * Math.cos(angle - Math.PI / 7), endY - arrowSize * Math.sin(angle - Math.PI / 7));
                ctx.lineTo(endX - arrowSize * Math.cos(angle + Math.PI / 7), endY - arrowSize * Math.sin(angle + Math.PI / 7));
                ctx.closePath();
                ctx.fillStyle = color;
                ctx.fill();
            }

            if (isInteractive) {
                ctx.beginPath();
                ctx.arc(endX, endY, 12, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = color;
                ctx.stroke();
                
                const ringPulse = 14 + 4 * Math.sin(animationTime * 3);
                ctx.beginPath();
                ctx.arc(endX, endY, ringPulse, 0, Math.PI * 2);
                ctx.strokeStyle = color + '80';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            if (label && !isDashed) {
                ctx.font = 'bold 20px "Kantumruy Pro", sans-serif';
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#000000';
                ctx.shadowBlur = 8;
                
                const labelOffX = endX + 30 * Math.cos(angle);
                const labelOffY = endY + 30 * Math.sin(angle);
                
                ctx.fillText(label, labelOffX - 10, labelOffY + 8);
            }

            ctx.restore();
        }

        function animate() {
            animationTime += 0.02; 
            
            calculateResultant();
            updateUI();

            // Handle Cube Animation
            if (isPlaying) {
                const resMag = Math.hypot(fResult.dx, fResult.dy);
                if (resMag > 0) {
                    const speed = 3; // Animation speed
                    const dirX = fResult.dx / resMag;
                    const dirY = fResult.dy / resMag;
                    
                    cubePos.x += dirX * speed;
                    cubePos.y += dirY * speed;

                    // Stop if reached the end of resultant vector
                    const currentDist = Math.hypot(cubePos.x, cubePos.y);
                    if (currentDist >= resMag) {
                        cubePos.x = fResult.dx;
                        cubePos.y = fResult.dy;
                    }
                }
            }

            drawGrid();

            // Parallelogram Dotted Lines
            drawVector(originX + f1.dx, originY + f1.dy, originX + fResult.dx, originY + fResult.dy, '#475569', '', true);
            drawVector(originX + f2.dx, originY + f2.dy, originX + fResult.dx, originY + fResult.dy, '#475569', '', true);

            // Vectors
            drawVector(originX, originY, originX + f1.dx, originY + f1.dy, f1.color, 'F₁', false, true);
            drawVector(originX, originY, originX + f2.dx, originY + f2.dy, f2.color, 'F₂', false, true);
            drawVector(originX, originY, originX + fResult.dx, originY + fResult.dy, fResult.color, 'F', false, false, true);

            // Draw 3D Object at animating position
            draw3DCube(originX + cubePos.x, originY + cubePos.y, 40);

            requestAnimationFrame(animate);
        }

        function getPointerPos(evt) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: evt.clientX - rect.left,
                y: evt.clientY - rect.top
            };
        }

        function handlePointerDown(e) {
            const pos = getPointerPos(e);
            
            // Hit test F1
            if (Math.hypot(pos.x - (originX + f1.dx), pos.y - (originY + f1.dy)) <= HITBOX_RADIUS) {
                draggingElement = 'f1';
                canvas.style.cursor = 'grabbing';
                canvas.setPointerCapture(e.pointerId);
                resetAnimation(); // Reset animation when user interact
                return;
            }

            // Hit test F2
            if (Math.hypot(pos.x - (originX + f2.dx), pos.y - (originY + f2.dy)) <= HITBOX_RADIUS) {
                draggingElement = 'f2';
                canvas.style.cursor = 'grabbing';
                canvas.setPointerCapture(e.pointerId);
                resetAnimation(); // Reset animation when user interact
                return;
            }
        }

        function handlePointerMove(e) {
            if (!draggingElement) return;

            const pos = getPointerPos(e);
            let dx = pos.x - originX;
            let dy = pos.y - originY;

            if (draggingElement === 'f1') {
                f1.dx = dx;
                f1.dy = dy;
            } else if (draggingElement === 'f2') {
                f2.dx = dx;
                f2.dy = dy;
            }
        }

        function handlePointerUp(e) {
            if(draggingElement) {
                canvas.releasePointerCapture(e.pointerId);
                draggingElement = null;
                canvas.style.cursor = 'crosshair';
            }
        }

        canvas.addEventListener('pointerdown', handlePointerDown);
        canvas.addEventListener('pointermove', handlePointerMove);
        canvas.addEventListener('pointerup', handlePointerUp);
        canvas.addEventListener('pointercancel', handlePointerUp);

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); }, { passive: false });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });

        function setPreset(type) {
            const n3 = 3 * PIXELS_PER_NEWTON;
            const n4 = 4 * PIXELS_PER_NEWTON;
            resetAnimation(); 
            
            if (type === 'same') {
                f1 = { dx: n3, dy: 0, color: '#ef4444' };
                f2 = { dx: n4, dy: 0, color: '#3b82f6' };
            } else if (type === 'opposite') {
                f1 = { dx: -n3, dy: 0, color: '#ef4444' };
                f2 = { dx: n4, dy: 0, color: '#3b82f6' };
            } else if (type === 'perpendicular') {
                f1 = { dx: 0, dy: -n3, color: '#ef4444' };
                f2 = { dx: n4, dy: 0, color: '#3b82f6' };
            }
        }

        window.onload = function() {
            resize();
            setPreset('perpendicular'); 
            animate();
        }

    </script>
</body>
</html>
