<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>លំហាត់លេខ១៨</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Khmer OS Battambang', sans-serif; background-color: #111; }
        #info { 
            position: absolute; top: 10px; left: 10px; color: white; background: rgba(15, 15, 15, 0.95); 
            padding: 15px; border-radius: 8px; pointer-events: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.8);
            line-height: 1.5; width: 480px; max-height: 95vh; overflow-y: auto; border: 1px solid #2196F3;
        }
        #info h3 { margin-top: 0; color: #2196F3; border-bottom: 1px solid #444; padding-bottom: 5px; font-size: 16px;}
        .problem-text { color: #ccc; margin-bottom: 15px; font-size: 13px; border-left: 3px solid #2196F3; padding-left: 10px; }
        
        .graph-container { text-align: center; background: #fff; padding: 5px; border-radius: 5px; margin-bottom: 10px; position: relative; }
        canvas.graph { width: 100%; height: 160px; display: block; }
        .graph-title { position: absolute; top: 5px; left: 10px; color: #000; font-weight: bold; font-size: 12px; z-index: 10;}
        
        #controls { position: absolute; bottom: 20px; left: 520px; z-index: 100; display: flex; gap: 10px; }
        button { padding: 10px 20px; font-size: 15px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; color: white; transition: 0.3s; }
        #startBtn { background-color: #4CAF50; } #startBtn:hover { background-color: #45a049; }
        #pauseBtn { background-color: #ff9800; } #pauseBtn:hover { background-color: #e68a00; }
        #resetBtn { background-color: #f44336; } #resetBtn:hover { background-color: #d32f2f; }
        
        .data-panel { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 5px; font-size: 13px;}
        .hl-t { color: #ffeb3b; font-weight: bold; } .hl-x { color: #00bcd4; font-weight: bold; }
        .hl-v { color: #ff5722; font-weight: bold; } .hl-a { color: #9c27b0; font-weight: bold; }
        .ans { color: #8bc34a; font-weight: bold; }
        
        #info::-webkit-scrollbar { width: 6px; }
        #info::-webkit-scrollbar-track { background: #222; }
        #info::-webkit-scrollbar-thumb { background: #2196F3; border-radius: 4px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="info">
        <h3>លំហាត់ទី១៨៖ ចលនាចំណុចរូបធាតុ និង ក្រាប</h3>
        <div class="problem-text">
            ១៨. ចំណុចរូបធាតុមួយចាប់ផ្តើមពីភាពនៅស្ងៀម និងស្ទុះដោយសំទុះដូចក្រាប a(t)។<br>
            ក. កំណត់ល្បឿនរបស់ចំណុចរូបធាតុត្រង់ t = 10.0 s និងត្រង់ t = 20.0 s ។<br>
            ខ. កំណត់ចម្ងាយដែលចរបានក្នុង 20.0 s ដំបូង ។
        </div>

        <div class="graph-container" style="border: 2px solid #9c27b0;">
            <div class="graph-title" style="color: #9c27b0;">ប្រធាន៖ ក្រាបសំទុះ a(t)</div>
            <canvas id="aGraph" class="graph" width="450" height="150"></canvas>
        </div>
        <div class="graph-container">
            <div class="graph-title" style="color: #ff5722;">ក្រាបល្បឿន v(t) (ទាញចេញពីការគណនា)</div>
            <canvas id="vGraph" class="graph" width="450" height="150"></canvas>
        </div>

        <div class="data-panel" id="stats"></div>
    </div>
    
    <div id="controls">
        <button id="startBtn">ចាប់ផ្តើម (Start)</button>
        <button id="pauseBtn">បញ្ឈប់ (Pause)</button>
        <button id="resetBtn">កំណត់ឡើងវិញ</button>
    </div>

    <script>
        // --- ផ្នែកទី១៖ រូបវិទ្យា (Physics Logic) ---
        let time = 0;
        const maxTime = 20.0;
        let x_pos = 0, v_vel = 0, a_accel = 0;
        let isRunning = false, isFinished = false;
        const clock = new THREE.Clock();

        function calculatePhysics(t) {
            let a, v, x;
            if (t <= 10) {
                a = 2; v = 2 * t; x = 0.5 * 2 * t * t;
            } else if (t <= 15) {
                a = 0; v = 20; x = 100 + 20 * (t - 10);
            } else { // 15 to 20
                a = -3; v = 20 - 3 * (t - 15); 
                x = 200 + 20 * (t - 15) - 1.5 * (t - 15) * (t - 15);
            }
            return { a, v, x };
        }

        // --- ផ្នែកទី២៖ ក្រាប (Canvas Graphs) ---
        function drawGraphs(t_current) {
            drawAGraph(t_current);
            drawVGraph(t_current);
        }

        function drawAGraph(t_current) {
            const cvs = document.getElementById('aGraph');
            const ctx = cvs.getContext('2d');
            ctx.clearRect(0, 0, cvs.width, cvs.height);
            
            const m = { l: 40, r: 20, t: 25, b: 25 };
            const w = cvs.width - m.l - m.r, h = cvs.height - m.t - m.b;
            const mapX = (t) => m.l + (t / 22) * w;
            const mapY = (a) => m.t + h - ((a + 3.5) / 6) * h; // Range -3.5 to 2.5

            ctx.strokeStyle = '#eee'; ctx.lineWidth = 1; ctx.beginPath();
            for(let t=0; t<=20; t+=5) { ctx.moveTo(mapX(t), m.t); ctx.lineTo(mapX(t), m.t+h); }
            for(let a=-3; a<=2; a+=1) { ctx.moveTo(m.l, mapY(a)); ctx.lineTo(m.l+w, mapY(a)); }
            ctx.stroke();

            ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.beginPath();
            ctx.moveTo(mapX(0), mapY(0)); ctx.lineTo(mapX(22), mapY(0)); 
            ctx.moveTo(mapX(0), mapY(-3.5)); ctx.lineTo(mapX(0), mapY(2.5)); 
            ctx.stroke();

            ctx.fillStyle = '#000'; ctx.font = '11px Arial';
            [5,10,15,20].forEach(t => ctx.fillText(t, mapX(t)-5, mapY(0)+12));
            [2,1,-1,-2,-3].forEach(a => ctx.fillText(a, mapX(0)-15, mapY(a)+4));
            ctx.fillText("a(m/s²)", mapX(0)-10, m.t-10); ctx.fillText("t(s)", mapX(22), mapY(0)+15);

            ctx.strokeStyle = '#9c27b0'; ctx.lineWidth = 3; ctx.beginPath();
            ctx.moveTo(mapX(0), mapY(calculatePhysics(0).a));
            for(let t=0.1; t<=t_current; t+=0.1) {
                let prev = calculatePhysics(t-0.1).a, cur = calculatePhysics(t).a;
                if(Math.abs(cur - prev) > 1) ctx.lineTo(mapX(t), mapY(prev));
                ctx.lineTo(mapX(t), mapY(cur));
            }
            ctx.stroke();
            
            ctx.fillStyle = '#9c27b0'; ctx.beginPath();
            ctx.arc(mapX(t_current), mapY(calculatePhysics(t_current).a), 4, 0, Math.PI*2); ctx.fill();
        }

        function drawVGraph(t_current) {
            const cvs = document.getElementById('vGraph');
            const ctx = cvs.getContext('2d');
            ctx.clearRect(0, 0, cvs.width, cvs.height);
            
            const m = { l: 40, r: 20, t: 25, b: 25 };
            const w = cvs.width - m.l - m.r, h = cvs.height - m.t - m.b;
            const mapX = (t) => m.l + (t / 22) * w;
            const mapY = (v) => m.t + h - (v / 25) * h; // Range 0 to 25

            ctx.strokeStyle = '#eee'; ctx.lineWidth = 1; ctx.beginPath();
            for(let t=0; t<=20; t+=5) { ctx.moveTo(mapX(t), m.t); ctx.lineTo(mapX(t), m.t+h); }
            for(let v=0; v<=20; v+=5) { ctx.moveTo(m.l, mapY(v)); ctx.lineTo(m.l+w, mapY(v)); }
            ctx.stroke();

            ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.beginPath();
            ctx.moveTo(mapX(0), mapY(0)); ctx.lineTo(mapX(22), mapY(0)); 
            ctx.moveTo(mapX(0), mapY(0)); ctx.lineTo(mapX(0), mapY(25)); 
            ctx.stroke();

            ctx.fillStyle = '#000'; ctx.font = '11px Arial';
            [5,10,15,20].forEach(t => ctx.fillText(t, mapX(t)-5, mapY(0)+12));
            [5,10,15,20].forEach(v => ctx.fillText(v, mapX(0)-20, mapY(v)+4));
            ctx.fillText("v(m/s)", mapX(0)-10, m.t-10); ctx.fillText("t(s)", mapX(22), mapY(0)+15);

            ctx.strokeStyle = '#ff5722'; ctx.lineWidth = 3; ctx.beginPath();
            ctx.moveTo(mapX(0), mapY(0));
            for(let t=0.1; t<=t_current; t+=0.1) ctx.lineTo(mapX(t), mapY(calculatePhysics(t).v));
            ctx.stroke();
            
            ctx.fillStyle = '#ff5722'; ctx.beginPath();
            ctx.arc(mapX(t_current), mapY(calculatePhysics(t_current).v), 4, 0, Math.PI*2); ctx.fill();
        }

        // --- ផ្នែកទី៣៖ 3D Scene ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(-20, 30, 60); 
        camera.lookAt(-20, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(0, 50, 20);
        scene.add(dirLight);

        const gridHelper = new THREE.GridHelper(300, 30, 0x555555, 0x333333);
        gridHelper.position.set(120, -2, 0);
        scene.add(gridHelper);

        const axisMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
        const axisGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-10, 0, 0), new THREE.Vector3(280, 0, 0)]);
        scene.add(new THREE.Line(axisGeo, axisMat));

        for (let i = 0; i <= 280; i += 20) {
            const m = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1, 0.2), new THREE.MeshBasicMaterial({ color: 0xaaaaaa }));
            m.position.set(i, 0, 0);
            scene.add(m);
        }

        const particle = new THREE.Mesh(new THREE.SphereGeometry(1.5, 32, 32), new THREE.MeshStandardMaterial({ color: 0x00bcd4 }));
        scene.add(particle);

        const vArrow = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(0,0,0), 1, 0xff5722, 1.5, 1);
        const aArrow = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(0,0,0), 1, 0x9c27b0, 1.5, 1);
        scene.add(vArrow); scene.add(aArrow);

        function updateUI() {
            const stats = document.getElementById('stats');
            let status = isFinished ? " <span style='color:#4CAF50'>(ចប់)</span>" : (isRunning ? "" : " <span style='color:#ff9800'>(ផ្អាក)</span>");
            
            let html = `នាឡិកា <span class="hl-t">t = ${time.toFixed(2)} s</span> ${status}<br>`;
            html += `ទីតាំង <span class="hl-x">x = ${x_pos.toFixed(2)} m</span><br>`;
            html += `ល្បឿន <span class="hl-v">v = ${v_vel.toFixed(2)} m/s</span><br>`;
            html += `សំទុះ <span class="hl-a">a = ${a_accel.toFixed(2)} m/s²</span><br><br>`;
            
            html += `<b>ចម្លើយ៖</b><br>`;
            html += `ក. v(10s) = <span class="ans">20 m/s</span> , v(20s) = <span class="ans">5 m/s</span><br>`;
            html += `ខ. ចម្ងាយសរុប (20s) = 100 + 100 + 62.5 = <span class="ans">262.5 m</span>`;
            
            stats.innerHTML = html;
        }

        document.getElementById('startBtn').addEventListener('click', () => { if (!isFinished) { isRunning = true; clock.getDelta(); } });
        document.getElementById('pauseBtn').addEventListener('click', () => { isRunning = false; updateUI(); });
        document.getElementById('resetBtn').addEventListener('click', () => {
            isRunning = false; isFinished = false; time = 0; updateSimulationState(); 
        });

        function updateSimulationState() {
            let phys = calculatePhysics(time);
            x_pos = phys.x; v_vel = phys.v; a_accel = phys.a;

            particle.position.x = x_pos;
            
            vArrow.position.set(x_pos, 2, 0);
            if(Math.abs(v_vel) > 0.1) {
                vArrow.visible = true;
                vArrow.setDirection(new THREE.Vector3(Math.sign(v_vel), 0, 0));
                vArrow.setLength(Math.abs(v_vel) * 0.4); 
            } else vArrow.visible = false;

            aArrow.position.set(x_pos, 4, 0);
            if(Math.abs(a_accel) > 0.1) {
                aArrow.visible = true;
                aArrow.setDirection(new THREE.Vector3(Math.sign(a_accel), 0, 0));
                aArrow.setLength(Math.abs(a_accel) * 2); 
            } else aArrow.visible = false;

            camera.position.x = x_pos - 10; 
            camera.lookAt(x_pos + 10, 0, 0);

            drawGraphs(time);
            updateUI();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isRunning) {
                time += clock.getDelta() * 2.0; // Playback speed multiplier
                if (time >= maxTime) { time = maxTime; isRunning = false; isFinished = true; }
                updateSimulationState();
            }
            renderer.render(scene, camera);
        }

        updateSimulationState();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
