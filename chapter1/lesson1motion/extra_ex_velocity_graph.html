<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ល្បឿនមធ្យម និង ល្បឿនខណៈ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Suwannaphum:wght@300;400;700&display=swap');
        
        body {
            font-family: 'Suwannaphum', sans-serif;
            background-color: #ecf0f1;
            color: #2c3e50;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background-color: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            max-width: 850px;
            width: 100%;
        }
        h2 {
            color: #2980b9;
            text-align: center;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .selector-group {
            text-align: center;
            margin-bottom: 20px;
        }
        select {
            font-family: 'Suwannaphum', sans-serif;
            font-size: 16px;
            padding: 8px 15px;
            border-radius: 5px;
            border: 1px solid #bdc3c7;
            background-color: #f8f9f9;
            cursor: pointer;
            font-weight: bold;
            color: #2c3e50;
        }
        .problem-statement {
            background-color: #eaf2f8;
            padding: 15px;
            border-left: 5px solid #2980b9;
            border-radius: 5px;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .control-group {
            background: #fdfefe;
            padding: 15px;
            border: 1px solid #d5dbdb;
            border-radius: 8px;
        }
        .control-group h3 {
            margin-top: 0;
            font-size: 16px;
        }
        label {
            display: flex;
            justify-content: space-between;
            margin: 10px 0 5px 0;
            font-size: 14px;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        canvas {
            display: block;
            margin: 0 auto;
            background: #fafafa;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }
        .results {
            margin-top: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 16px;
            font-weight: bold;
            background: #f4f6f7;
            padding: 15px;
            border-radius: 8px;
        }
        .res-avg { color: #27ae60; }
        .res-inst { color: #c0392b; }

        .solution-box {
            margin-top: 15px;
            background: #fff;
            padding: 15px;
            border-radius: 5px;
            border: 1px dashed #7f8c8d;
        }
        .solution-box summary {
            font-weight: bold;
            cursor: pointer;
            color: #8e44ad;
            outline: none;
        }
        .solution-box p { margin: 8px 0 0 0; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <h2>ល្បឿនមធ្យម និង ល្បឿនខណៈ</h2>
    
    <div class="selector-group">
        <label for="problemSelect" style="display:inline; font-size:16px;"><b>ជ្រើសរើសលំហាត់៖ </b></label>
        <select id="problemSelect">
            <option value="1">លំហាត់ទី១៖ ចលនាស្ទុះរបស់វត្ថុមួយ (ខ្សែកោងឡើង)</option>
            <option value="2">លំហាត់ទី២៖ ចលនាបន្ថយល្បឿន (ខ្សែកោងផតចុះ)</option>
            <option value="3">លំហាត់ទី៣៖ ចលនាថយក្រោយ (ល្បឿនអវិជ្ជមាន)</option>
        </select>
    </div>

    <div class="problem-statement" id="probDesc">
        <!-- Text injected via JS -->
    </div>

    <div class="controls">
        <div class="control-group">
            <h3 class="res-avg">លៃតម្រូវ ល្បឿនមធ្យម (បន្ទាត់កាត់ / ពណ៌បៃតង)</h3>
            <label>ពេល t₁ : <span id="t1_val">2.0 s</span></label>
            <input type="range" id="t1" min="0" max="8" step="0.1" value="2">
            
            <label>ពេល t₂ : <span id="t2_val">4.0 s</span></label>
            <input type="range" id="t2" min="0" max="8" step="0.1" value="4">
        </div>

        <div class="control-group">
            <h3 class="res-inst">លៃតម្រូវ ល្បឿនខណៈ (បន្ទាត់ប៉ះ / ពណ៌ក្រហម)</h3>
            <label>ខណៈពេល t : <span id="t_inst_val">3.0 s</span></label>
            <input type="range" id="t_inst" min="0" max="8" step="0.1" value="3">
        </div>
    </div>

    <canvas id="graphCanvas" width="750" height="400"></canvas>

    <div class="results">
        <div class="res-avg">ល្បឿនមធ្យម (V_avg) = <span id="res_avg_val">0.00</span> m/s</div>
        <div class="res-inst">ល្បឿនខណៈ (V_inst) = <span id="res_inst_val">0.00</span> m/s</div>
    </div>

    <details class="solution-box">
        <summary>មើលអំណះអំណាង និងដំណោះស្រាយ (ផ្អែកតាមទិន្នន័យដើមនៃលំហាត់)</summary>
        <div id="probSolution">
            <!-- Text injected via JS -->
        </div>
    </details>
</div>

<script>
    // Data Structure for the 3 Problems
    const problems = {
        1: {
            desc: "<b>ប្រធាន៖</b> វត្ថុមួយផ្លាស់ទីដោយមានសមីការទីតាំង <b>x(t) = t²</b> ។<br>១. រកល្បឿនមធ្យមចន្លោះពី t₁ = 2.0s (ទីតាំង 4m) ដល់ t₂ = 4.0s (ទីតាំង 16m)។<br>២. រកល្បឿនខណៈនៅពេល t = 3.0s។",
            sol: "<p><b>ល្បឿនមធ្យម៖</b> V_avg = (16 - 4) / (4 - 2) = 12 / 2 = <b>6.0 m/s</b></p><p><b>ល្បឿនខណៈនៅ t=3s៖</b> តាមដេរីវេ v(t) = 2t នាំឱ្យ v(3) = 2(3) = <b>6.0 m/s</b></p>",
            getX: (t) => t * t,
            getV: (t) => 2 * t,
            defT1: 2, defT2: 4, defTInst: 3,
            maxX: 5.5, maxY: 30
        },
        2: {
            desc: "<b>ប្រធាន៖</b> រថយន្តមួយចាប់ហ្វ្រាំងបន្ថយល្បឿនតាមសមីការ <b>x(t) = -0.5t² + 5t + 0.5</b> ។<br>១. រកល្បឿនមធ្យមចន្លោះពី t₁ = 1.0s (ទីតាំង 5m) ដល់ t₂ = 5.0s (ទីតាំង 13m)។<br>២. រកល្បឿនខណៈនៅពេល t = 3.0s។",
            sol: "<p><b>ល្បឿនមធ្យម៖</b> V_avg = (13 - 5) / (5 - 1) = 8 / 4 = <b>2.0 m/s</b></p><p><b>ល្បឿនខណៈនៅ t=3s៖</b> តាមដេរីវេ v(t) = -t + 5 នាំឱ្យ v(3) = -3 + 5 = <b>2.0 m/s</b></p>",
            getX: (t) => -0.5 * t * t + 5 * t + 0.5,
            getV: (t) => -t + 5,
            defT1: 1, defT2: 5, defTInst: 3,
            maxX: 8, maxY: 16
        },
        3: {
            desc: "<b>ប្រធាន៖</b> កង់មួយកំពុងជិះត្រឡប់ក្រោយ តាមសមីការ <b>x(t) = -0.5t² + 2t + 8</b> ។<br>១. រកល្បឿនមធ្យមចន្លោះពី t₁ = 2.0s (ទីតាំង 10m) ដល់ t₂ = 6.0s (ទីតាំង 2m)។<br>២. រកល្បឿនខណៈនៅពេល t = 5.0s។",
            sol: "<p><b>ល្បឿនមធ្យម៖</b> V_avg = (2 - 10) / (6 - 2) = -8 / 4 = <b>-2.0 m/s</b></p><p><b>ល្បឿនខណៈនៅ t=5s៖</b> តាមដេរីវេ v(t) = -t + 2 នាំឱ្យ v(5) = -5 + 2 = <b>-3.0 m/s</b> (សញ្ញាដកបញ្ជាក់ថាវត្ថុមានចលនាត្រឡប់ក្រោយ)</p>",
            getX: (t) => -0.5 * t * t + 2 * t + 8,
            getV: (t) => -t + 2,
            defT1: 2, defT2: 6, defTInst: 5,
            maxX: 7.5, maxY: 12
        }
    };

    const canvas = document.getElementById('graphCanvas');
    const ctx = canvas.getContext('2d');
    const selector = document.getElementById('problemSelect');
    
    // UI Elements
    const sliderT1 = document.getElementById('t1');
    const sliderT2 = document.getElementById('t2');
    const sliderTInst = document.getElementById('t_inst');
    const displayT1 = document.getElementById('t1_val');
    const displayT2 = document.getElementById('t2_val');
    const displayTInst = document.getElementById('t_inst_val');
    const displayResAvg = document.getElementById('res_avg_val');
    const displayResInst = document.getElementById('res_inst_val');
    
    const descEl = document.getElementById('probDesc');
    const solEl = document.getElementById('probSolution');

    let currentProb = problems[1];

    function loadProblem() {
        let probId = selector.value;
        currentProb = problems[probId];
        
        // Update Texts
        descEl.innerHTML = currentProb.desc;
        solEl.innerHTML = currentProb.sol;

        // Update Sliders Max Value
        sliderT1.max = currentProb.maxX;
        sliderT2.max = currentProb.maxX;
        sliderTInst.max = currentProb.maxX;

        // Set Default Values
        sliderT1.value = currentProb.defT1;
        sliderT2.value = currentProb.defT2;
        sliderTInst.value = currentProb.defTInst;

        drawGraph();
    }

    // Map Coordinates
    const padding = 55;
    function mapToCanvas(t, x) {
        const cx = padding + (t / currentProb.maxX) * (canvas.width - padding * 1.5);
        const cy = canvas.height - padding - (x / currentProb.maxY) * (canvas.height - padding * 1.5);
        return { cx, cy };
    }

    function drawGraph() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Axes
        ctx.beginPath();
        ctx.moveTo(padding, 20);
        ctx.lineTo(padding, canvas.height - padding);
        ctx.lineTo(canvas.width - 20, canvas.height - padding);
        ctx.strokeStyle = '#2c3e50';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.font = '14px Suwannaphum, sans-serif';
        ctx.fillStyle = '#2c3e50';
        ctx.fillText('ពេល t (s)', canvas.width - 65, canvas.height - padding + 35);
        ctx.fillText('ទីតាំង x (m)', 10, 15);

        // Grid & Numbers
        ctx.font = '12px Arial';
        ctx.textAlign = "center";
        for (let i = 0; i <= currentProb.maxX; i += 1) {
            let { cx, cy } = mapToCanvas(i, 0);
            ctx.fillText(i, cx, cy + 20);
            ctx.fillStyle = "#ecf0f1";
            ctx.fillRect(cx, 20, 1, canvas.height - padding - 20);
            ctx.fillStyle = "#2c3e50";
        }
        ctx.textAlign = "right";
        let stepY = currentProb.maxY > 20 ? 5 : 2;
        for (let j = 0; j <= currentProb.maxY; j += stepY) {
            let { cx, cy } = mapToCanvas(0, j);
            ctx.fillText(j, cx - 10, cy + 4);
            ctx.fillStyle = "#ecf0f1";
            ctx.fillRect(padding, cy, canvas.width - padding - 20, 1);
            ctx.fillStyle = "#2c3e50";
        }

        // Draw the Position Curve
        ctx.beginPath();
        for (let t = 0; t <= currentProb.maxX; t += 0.05) {
            let x = currentProb.getX(t);
            let { cx, cy } = mapToCanvas(t, x);
            if (t === 0) ctx.moveTo(cx, cy);
            else ctx.lineTo(cx, cy);
        }
        ctx.strokeStyle = '#3498db'; 
        ctx.lineWidth = 3;
        ctx.stroke();

        // Get Values
        let t1 = parseFloat(sliderT1.value);
        let t2 = parseFloat(sliderT2.value);
        let tInst = parseFloat(sliderTInst.value);

        // --- Average Velocity (Secant Line) ---
        let x1 = currentProb.getX(t1);
        let x2 = currentProb.getX(t2);
        let pt1 = mapToCanvas(t1, x1);
        let pt2 = mapToCanvas(t2, x2);
        
        ctx.beginPath();
        ctx.moveTo(pt1.cx, pt1.cy);
        ctx.lineTo(pt2.cx, pt2.cy);
        ctx.strokeStyle = '#27ae60';
        ctx.setLineDash([6, 6]); 
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#27ae60';
        ctx.beginPath(); ctx.arc(pt1.cx, pt1.cy, 5, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(pt2.cx, pt2.cy, 5, 0, Math.PI*2); ctx.fill();

        // --- Instantaneous Velocity (Tangent Line) ---
        let xInst = currentProb.getX(tInst);
        let vInst = currentProb.getV(tInst);
        let ptInst = mapToCanvas(tInst, xInst);

        let dt = 1.5; 
        let tTan1 = tInst - dt;
        let tTan2 = tInst + dt;
        let xTan1 = xInst + vInst * (-dt);
        let xTan2 = xInst + vInst * (dt);
        let ptTan1 = mapToCanvas(tTan1, xTan1);
        let ptTan2 = mapToCanvas(tTan2, xTan2);

        ctx.beginPath();
        ctx.moveTo(ptTan1.cx, ptTan1.cy);
        ctx.lineTo(ptTan2.cx, ptTan2.cy);
        ctx.strokeStyle = '#c0392b'; 
        ctx.lineWidth = 2;
        ctx.stroke();

        // Arrowhead
        let angle = Math.atan2(ptTan2.cy - ptTan1.cy, ptTan2.cx - ptTan1.cx);
        ctx.beginPath();
        ctx.moveTo(ptTan2.cx, ptTan2.cy);
        ctx.lineTo(ptTan2.cx - 10 * Math.cos(angle - Math.PI/6), ptTan2.cy - 10 * Math.sin(angle - Math.PI/6));
        ctx.lineTo(ptTan2.cx - 10 * Math.cos(angle + Math.PI/6), ptTan2.cy - 10 * Math.sin(angle + Math.PI/6));
        ctx.lineTo(ptTan2.cx, ptTan2.cy);
        ctx.fillStyle = '#c0392b';
        ctx.fill();

        ctx.beginPath(); ctx.arc(ptInst.cx, ptInst.cy, 6, 0, Math.PI*2); ctx.fill();

        // Update UI Text
        let vAvg = (t2 === t1) ? currentProb.getV(t1) : (x2 - x1) / (t2 - t1);
        displayT1.innerText = t1.toFixed(1) + " s";
        displayT2.innerText = t2.toFixed(1) + " s";
        displayTInst.innerText = tInst.toFixed(1) + " s";
        displayResAvg.innerText = vAvg.toFixed(2);
        displayResInst.innerText = vInst.toFixed(2);
    }

    // Event Listeners
    selector.addEventListener('change', loadProblem);
    sliderT1.addEventListener('input', drawGraph);
    sliderT2.addEventListener('input', drawGraph);
    sliderTInst.addEventListener('input', drawGraph);

    // Init
    loadProblem();
</script>

</body>
</html>
